<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gridviz pillar example</title>
        <style>
            html,
            body {
                height: 100%; /* Ensure the parent elements have a height so that the map can take up 100% correctly */
                margin: 0; /* Remove default margins to prevent scrolling */
                overflow: hidden; /* Prevent potential scrollbars */
            }
        </style>
    </head>
    <body>
        <div id="map" style="height: 100%; width: 100%"></div>
        <div
            id="settings"
            style="
                position: absolute;
                left: 20px;
                top: 20px;
                padding: 10px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 5px 5px 5px grey;
                font-family: Arial, Helvetica, sans-serif;
            "
        >
            Height: <b id="heightValue">300</b><br />
            <input type="range" id="height" min="50" max="1500" step="50" value="300" style="width: 250px" /><br />
            Width, in cells: <b id="widthValue">0.3</b><br />
            <input type="range" id="width" min="0.1" max="0.8" step="0.05" value="0.3" style="width: 250px" /><br />
            Length of the shadow: <b id="shadowValue">0.5</b><br />
            <input type="range" id="shadow" min="0" max="1" step="0.1" value="0.5" style="width: 250px" /><br />
            Direction of the shadow, in degrees: <b id="directionValue">21</b><br />
            <input type="range" id="direction" min="0" max="360" step="5" value="21" style="width: 250px" />
        </div>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.0.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script>
            //the settings of the sliders. The style reads them when it draws.
            const settings = {}
            let onSettingsChange = () => map.redraw()
            for (const input of document.querySelectorAll('#settings input')) {
                settings[input.id] = +input.value
                input.addEventListener('input', () => {
                    settings[input.id] = +input.value
                    document.getElementById(input.id + 'Value').textContent = input.value
                    onSettingsChange()
                })
            }

            //define map with initial view
            const map = new gridviz.Map(document.getElementById('map'), {
                x: 4500000,
                y: 2900000,
                z: 1500,
                backgroundColor: '#F3FBFF',
            }).addZoomButtons()

            //define multi resolution dataset
            const dataset = new gridviz.MultiResolutionDataset(
                [1000, 2000, 5000, 10000, 20000, 50000, 100000],
                (resolution) =>
                    new gridviz.TiledGrid(
                        map,
                        'https://raw.githubusercontent.com/jgaffuri/tiledgrids/main/data/europe/population2/' +
                            resolution +
                            'm/'
                    ),
                { preprocess: (cell) => +cell.TOT_P_2021 > 0 }
            )

            //define style
            const style = new gridviz.PillarStyle({
                viewScale: (cells) => d3.max(cells, (cell) => +cell.TOT_P_2021),
                height: (cell, resolution, z, max) => (settings.height * z * cell.TOT_P_2021) / max,
                simple: () => true,
                color: () => '#FF3D12aa',
                viewHeightFactor: 5,
                width: (cell, resolution) => settings.width * resolution,
                viewSX: -0.7,
                viewSY: -3,
                shadowDirection: (21 * Math.PI) / 180.0,
                shadowFactor: 0.5,
            })

            //define grid layer
            const gridLayer = new gridviz.GridLayer(dataset, [style], {
                minPixelsPerCell: 6,
                cellInfoHTML: (c) => '<b>' + c.TOT_P_2021 + '</b> inhabitant(s)',
            })

            //define background layer
            const backgroundLayer = new gridviz.BackgroundLayer({
                url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/elevation_shading/',
                resolutions: Array.from({ length: 9 }, (_, i) => 28.00132289714475 * Math.pow(2, 10 - i)),
                origin: [0, 6000000],
                filterColor: (z) => '#ffffff77',
            })

            //define boundaries layer
            const boundariesLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())

            //define label layer
            const labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('EUR', 50))

            //add layer to map
            map.layers = [backgroundLayer, gridLayer, boundariesLayer, labelLayer]

            onSettingsChange = () => {
                style.shadowFactor = settings.shadow
                style.shadowDirection = (settings.direction * Math.PI) / 180
                map.redraw()
            }
        </script>
    </body>
</html>
