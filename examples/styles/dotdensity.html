<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gridviz dot density example</title>
        <style>
            html,
            body {
                height: 100%; /* Ensure the parent elements have a height so that the map can take up 100% correctly */
                margin: 0; /* Remove default margins to prevent scrolling */
                overflow: hidden; /* Prevent potential scrollbars */
            }
        </style>
    </head>
    <body>
        <div id="map" style="height: 100%; width: 100%"></div>
        <div id="settings" style="position: absolute; left: 20px; top: 20px; padding: 10px; border-radius: 5px; background: #ffffffcc; line-height: 1.6; box-shadow: 5px 5px 5px grey; font-family: Arial, Helvetica, sans-serif">
            People per dot: <b id="peopleValue">5</b><br />
            <input type="range" id="people" min="1" max="20" step="1" value="5" style="width: 250px" /><br />
            Dot size: <b id="dotSizeValue">1.2</b><br />
            <input type="range" id="dotSize" min="0.3" max="4" step="0.1" value="1.2" style="width: 250px" />
        </div>

        <script src="../../dist/gridviz.js"></script>
        <script>
            //the settings of the sliders. The style reads them when it draws.
            const settings = {}
            let onSettingsChange = () => map.redraw()
            for (const input of document.querySelectorAll('#settings input')) {
                settings[input.id] = +input.value
                input.addEventListener('input', () => {
                    settings[input.id] = +input.value
                    document.getElementById(input.id + 'Value').textContent = input.value
                    onSettingsChange()
                })
            }

            //define map with initial view
            const map = new gridviz.Map(document.getElementById('map'), {
                x: 4500000,
                y: 2900000,
                z: 3000,
            }).addZoomButtons()

            //define dataset
            const dataset = new gridviz.CSVGrid(
                map,
                'https://raw.githubusercontent.com/eurostat/gridviz/master/assets/csv/Europe/pop_2018_10km.csv',
                10000
            )

            //define style
            const style = new gridviz.DotDensityStyle({
                dotNumber: (c, r, z) => c.population / z / settings.people,
                dotSize: (r, z) => settings.dotSize * z,
                color: () => '#FF5733',
            })

            //add layer to map
            map.layers = [
                new gridviz.GridLayer(dataset, [style], {
                    cellInfoHTML: (c) => '<b>' + (+c.population).toLocaleString() + '</b> inhabitants (2018)',
                }),
            ]
        </script>
    </body>
</html>
