<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gridviz dot density example</title>
        <style>
            html,
            body {
                height: 100%; /* Ensure the parent elements have a height so that the map can take up 100% correctly */
                margin: 0; /* Remove default margins to prevent scrolling */
                overflow: hidden; /* Prevent potential scrollbars */
            }
        </style>
    </head>
    <body>
        <div id="map" style="height: 100%; width: 100%"></div>
        <div
            id="settings"
            style="
                position: absolute;
                left: 20px;
                top: 20px;
                padding: 10px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 5px 5px 5px grey;
                font-family: Arial, Helvetica, sans-serif;
            "
        >
            Dots per inhabitant, relative: <b id="dotsValue">2</b><br />
            <input type="range" id="dots" min="0.5" max="6" step="0.5" value="2" style="width: 250px" /><br />
            Size of the dots: <b id="dotSizeValue">1.6</b><br />
            <input type="range" id="dotSize" min="0.5" max="4" step="0.1" value="1.6" style="width: 250px" /><br />
            Spread of the dots, in cells: <b id="spreadValue">0.25</b><br />
            <input type="range" id="spread" min="0.05" max="0.6" step="0.05" value="0.25" style="width: 250px" />
        </div>
        <style>
            @font-face {
                font-family: mf;
                src: url(https://raw.githubusercontent.com/eurostat/gridviz/master/assets/font/MilkyCoffee.woff);
            }
        </style>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.0.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script>
            //the settings of the sliders. The style reads them when it draws.
            const settings = {}
            let onSettingsChange = () => map.redraw()
            for (const input of document.querySelectorAll('#settings input')) {
                settings[input.id] = +input.value
                input.addEventListener('input', () => {
                    settings[input.id] = +input.value
                    document.getElementById(input.id + 'Value').textContent = input.value
                    onSettingsChange()
                })
            }

            //define map with initial view
            const map = new gridviz.Map(document.getElementById('map'), {
                x: 4000000,
                y: 2960000,
                z: 400,
                zoomExtent: [30, 7000],
                backgroundColor: '#eaeaea',
            }).addZoomButtons()

            //define multi resolution dataset
            const dataset = new gridviz.MultiResolutionDataset(
                [1000, 2000, 5000, 10000, 20000, 50000, 100000],
                (resolution) =>
                    new gridviz.TiledGrid(
                        map,
                        'https://raw.githubusercontent.com/jgaffuri/tiledgrids/main/data/europe/population2/' +
                            resolution +
                            'm/'
                    ),
                { preprocess: (cell) => +cell.TOT_P_2021 > 0 }
            )

            //define style
            const style = new gridviz.DotDensityStyle({
                //viewScale: (cells) => d3.max(cells, cell => cell.TOT_P_2021),
                dotNumber: (c, r, z, max) => (c.TOT_P_2021 / z) * settings.dots, //10000 * c.TOT_P_2021 / z,
                dotSize: (r, z) => settings.dotSize * z,
                color: () => d3.schemeCategory10[Math.floor(10 * Math.random())],
                sigma: (r, z) => settings.spread * r,
            })

            //define grid layer
            const gridLayer = new gridviz.GridLayer(dataset, [style], {
                minPixelsPerCell: 10,
                cellInfoHTML: (c) => '<b>' + c.TOT_P_2021 + '</b> inhabitant(s)',
            })

            //define background layer
            const backgroundLayer = new gridviz.BackgroundLayer(
                gridviz_eurostat.giscoBackgroundLayer('GreyEarth', 7, 'EPSG3035', {
                    filterColor: () => '#ffffffd3',
                })
            )

            //define label layer
            const labelLayer = new gridviz.LabelLayer(
                gridviz_eurostat.getEuronymeLabelLayer('EUR', 50, {
                    ex: 1.8,
                    fontFamily: 'mf',
                    exSize: 1.1,
                    color: () => d3.schemeCategory10[Math.floor(10 * Math.random())],
                    haloColor: () => '#ffffff',
                    haloWidth: () => 3,
                })
            )

            //add layers to map
            map.layers = [backgroundLayer, gridLayer, labelLayer]
        </script>
    </body>
</html>
