<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="maximum-scale=1.0, user-scalable=no" />
        <title>Gridviz - example</title>
    </head>

    <body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">
        <div id="viz-container" style="height: 100%; width: 100%"></div>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script>
            //define map with initial view
            const map = new gridviz.Map(document.getElementById('viz-container'), {
                x: 3763437,
                y: 2891045,
                z: 150,
            }).addZoomButtons()

            //stretching of the sizes of the circles (the population of the cells, in the view) and of the colors
            const sizeStretching = gridviz.logarithmicScale(-12)
            const colorStretching = gridviz.logarithmicScale(-3.5)

            //dataset: the buildings of the cells of the European grid, at several resolutions
            //x,y,TOT_P_2021,agri,comm_serv,indus,res
            const dataset = new gridviz.MultiResolutionDataset(
                [1000, 2000, 5000, 10000, 20000, 50000, 100000],
                (r) =>
                    new gridviz.TiledGrid(
                        map,
                        'https://raw.githubusercontent.com/jgaffuri/tiledgrids/main/data/europe/bustat/' + r + 'm/'
                    ),
                {
                    preprocess: (c) => {
                        c.TOT_P_2021 = +c.TOT_P_2021
                        c.res = +c.res
                        c.agri = +c.agri
                        c.indus = +c.indus
                        c.comm_serv = +c.comm_serv
                        c.bu = c.res + c.agri + c.indus + c.comm_serv
                        c.habPer100m2 = c.res > 0 ? (+c.TOT_P_2021 / c.res) * 100 : -999
                        c.resSurfPerHab = c.TOT_P_2021 > 0 ? c.res / c.TOT_P_2021 : -999
                        c.valid =
                            c.TOT_P_2021 == 0 && c.res > 0
                                ? 'nonPopRes'
                                : c.TOT_P_2021 > 0 && c.res == 0
                                ? 'nonResPop'
                                : 'ok'
                    },
                }
            )

            //the circles: their size is the surface of residential buildings, their color the number of inhabitants per 100 m2
            const style = new gridviz.ShapeColorSizeStyle({
                viewScale: gridviz.viewScale({
                    valueFunction: (c) => c.res,
                    stretching: sizeStretching,
                    maxSizeFactor: 1.4,
                }),
                size: (c, r, z, vs) => vs(c.res),
                shape: () => 'circle',
                color: (c) => {
                    const v = c.habPer100m2
                    if (v === -999) return
                    if (v === 0) return 'gray'
                    return d3.interpolateSpectral(1 - colorStretching(v / 8))
                },
                blendOperation: (z) => (z < 50 ? 'multiply' : 'source-over'),
            })

            //background layers
            const backgroundLayer1 = new gridviz.BackgroundLayer({
                url: 'https://gisco-services.ec.europa.eu/maps/tiles/OSMPositronBackground/EPSG3035/',
                resolutions: [
                    156543.03392804097, 78271.51696402048, 39135.75848201024, 19567.87924100512,
                    9783.93962050256, 4891.96981025128, 2445.98490512564, 1222.99245256282,
                    611.49622628141, 305.748113140705, 152.8740565703525, 76.43702828517625,
                    38.21851414258813, 19.109257071294063, 9.554628535647032, 4.777314267823516,
                    2.388657133911758, 1.19432856695, 0.597164283477939,
                ],
                origin: [0, 6000000],
                visible: (z) => z < 50,
            })
            const backgroundLayer2 = new gridviz.BackgroundLayer({
                url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/elevation_shading/',
                resolutions: Array.from({ length: 9 }, (_, i) => 28.00132289714475 * Math.pow(2, 10 - i)),
                origin: [0, 6000000],
                filterColor: () => '#ffffffc0',
                visible: (z) => z >= 50,
            })

            //boundaries and labels
            const boundaryLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())
            const labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('EUR', '20'))

            //the layers, from the bottom to the top
            map.layers = [
                backgroundLayer1,
                backgroundLayer2,
                new gridviz.GridLayer(dataset, [style], { minPixelsPerCell: 3 }),
                boundaryLayer,
                labelLayer,
            ]
            map.setViewFromURL()
            map.redraw()
        </script>
    </body>
</html>
