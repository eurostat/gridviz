<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="maximum-scale=1.0, user-scalable=no" />
        <title>INSEE Filosofi données carroyées en carte</title>
    </head>

    <body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">
        <div id="viz-container" style="height: 100%; width: 100%"></div>

        <div
            style="
                position: absolute;
                left: 20px;
                top: 20px;
                width: auto;
                height: auto;
                padding: 10px;
                border: 0px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 5px 5px 5px grey;
            "
        >
            <span style="font-size: 1.25em">
                <div>
                    Année:
                    <select id="year">
                        <option value="2015">2015</option>
                        <option value="2017">2017</option>
                        <option value="2019">2019</option>
                        <option value="2021" selected>2021</option>
                    </select>
                    <br />
                    Couche:
                    <select id="layer" name="layer">
                        <optgroup label="Population">
                            <option value="pop" selected>Population totale</option>
                            <option value="popAge">Par âge</option>
                            <option value="popAge3">Par âge (3 groupes)</option>
                            <option value="ageR">Equilibre jeunes/âgés</option>
                            <option value="income">Revenus</option>
                            <option value="poverty">Pauvreté</option>
                        </optgroup>
                        <optgroup label="Ménages">
                            <option value="men_size">Taille</option>
                            <option value="men_mono">Monoparental</option>
                        </optgroup>
                        <optgroup label="Logement">
                            <option value="men_owner">Propriétaires</option>
                            <option value="men_house_surf">Surface</option>
                            <option value="men_house_collective">Maison / logement collectif</option>
                            <option value="log_age">Par année de construction</option>
                        </optgroup>
                        <optgroup label="Logement social">
                            <option value="log_soc_nb">Nombre</option>
                            <option value="log_soc_per">Pourcentage</option>
                        </optgroup>
                    </select>
                </div>
                <hr />
                Géo:
                <select id="geo">
                    <option value="met" selected>France métropolitaine</option>
                    <option value="reun">Réunion</option>
                    <option value="mart">Martinique</option>
                </select>
                <br />
                <input type="checkbox" id="label" checked />
                <label for="label">Noms villes</label>
                <input type="checkbox" id="boundary" checked />
                <label for="boundary">Limites adm.</label>
                <input type="checkbox" id="background" checked />
                <label for="background">Fond</label>
                <hr />
                Source:
                <a
                    href="https://www.insee.fr/fr/statistiques/8735243"
                    target="_blank"
                    rel="noopener noreferrer"
                    >INSEE - Filosofi - 200m</a
                >
            </span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gridviz@3.5.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-parquet@1.2.1"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-format@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
        <script>
            //define map with initial view
            const map = new gridviz.Map(document.getElementById('viz-container'), {
                x: 3760000,
                y: 2750000,
                z: 300,
                zoomExtent: [3, 2000],
            }).addZoomButtons()

            //create datasets, indexed by geo, theme and year
            const ds = {}
            const baseURL = 'https://raw.githubusercontent.com/jgaffuri/tiled-grid-france-filosofi/main/out/parquet/'
            const dataset = (geo, theme, year, preprocess) =>
                new gridviz.MultiResolutionDataset(
                    [200, 400, 600, 1000, 2000, 5000, 10000, 20000, 50000, 100000],
                    (r) =>
                        new gviz_par.TiledParquetGrid(
                            map,
                            baseURL + geo + '/' + theme + '/' + year + '/' + r + 'm/'
                        ),
                    { preprocess: preprocess }
                )
            for (let geo of ['met', 'reun', 'mart']) {
                ds[geo] = { ind: {}, men: {}, log: {}, inc: {} }
                for (let year of [2015, 2017, 2019, 2021]) {
                    //dataset on population by age
                    ds[geo].ind[year] = dataset(geo, 'ind', year, (c) => {
                        c.ind_0_17 = +c.ind_0_3 + +c.ind_4_5 + +c.ind_6_10 + +c.ind_11_17
                        c.ind_18_64 = +c.ind_18_24 + +c.ind_25_39 + +c.ind_40_54 + +c.ind_55_64
                        c.ind_65p = +c.ind_65_79 + +c.ind_80p

                        //<24
                        c.yyy = +c.ind_0_3 + +c.ind_4_5 + +c.ind_6_10 + +c.ind_11_17 + +c.ind_18_24
                        //>65
                        c.ooo = +c.ind_65_79 + +c.ind_80p
                        c.age_ratio = c.yyy + c.ooo == 0 ? 0 : (c.yyy - c.ooo) / (c.yyy + c.ooo)
                        c.age_ratio = c.age_ratio * 0.5 + 0.5
                    })

                    //dataset on household stats
                    ds[geo].men[year] = dataset(geo, 'men', year, (c) => {
                        //ind per men
                        c.indPerMEn = c.ind / c.men
                        //poverty
                        c.rPoverty = c.men_pauv / c.men
                        // men_1ind - Nombre de ménages d’un seul individu
                        // men_5ind - Nombre de ménages de 5 individus ou plus
                        c.men_2_4ind = +c.men - +c.men_1ind - +c.men_5ind
                        // men_fmp - Nombre de ménages monoparentaux
                        c.rMenFmp = c.men_fmp / c.men
                        // men_prop - Nombre de ménages propriétaires
                        c.rMen_prop = +c.men_prop / +c.men
                        // men_surf - Somme de la surface des logements* du carreau
                        c.rMenSurf = +c.men_surf / +c.men
                    })

                    //dataset on housing stats
                    ds[geo].log[year] = dataset(geo, 'log', year, (c) => {
                        c.log = +c.log_av45 + +c.log_45_70 + +c.log_70_90 + +c.log_ap90 + +c.log_inc
                        // log_soc - Nombre de logements* sociaux
                        c.log_nsoc = +c.log - +c.log_soc
                        c.rLogSoc = c.log_soc / c.log
                    })

                    //dataset on total population and income
                    ds[geo].inc[year] = dataset(geo, 'inc', year, (c) => {
                        c.rIncome = c.ind_snv / c.ind / 12
                    })
                }
            }

            //the layers around the data, depending on the geography
            let backgroundLayers = []
            let boundaryLayer, labelLayer

            // ---------- helpers to make the styles ----------

            //formater
            const f1 = d3.format('.1f')

            const imputed = (c) => (+c.imputed ? '<br>(valeurs imputées)' : '')

            //the maximum of a column, in the view
            const maxOf = (column) => (cells) => d3.max(cells, (c) => +c[column])

            //the size of the symbols of a column: stretched, and in proportion of the maximum of the view
            const sizeViewScale = (column, factor, stretching) => (cells, resolution) => {
                const max = d3.max(cells, (c) => +c[column])
                return { size: (v) => factor * resolution * stretching(v / max), max: max }
            }

            //the legend of the size of the symbols
            const sizeLegends = (column, shape, unit, fillColor = '#ccc') =>
                [0.9, 0.2, 0.05].map(
                    (k) =>
                        new gridviz.SizeLegend({
                            shape: shape,
                            labelUnitText: unit,
                            fillColor: fillColor,
                            label: (vs) => gridviz.nice(k * vs.max),
                            size: (vs) => vs.size(gridviz.nice(k * vs.max)),
                        })
                )
            //a composition style: rings, flags, age pyramids...: the size of the symbols is the total of the cell
            const compositionStyle = (colors, type, column, factor, stretching, opts = {}) =>
                new gridviz.CompositionStyle({
                    color: colors,
                    type: () => type,
                    viewScale: sizeViewScale(column, factor, gridviz.powerScale(stretching)),
                    size: (c, r, z, vs) => vs.size(+c[column]),
                    ...opts,
                })

            //circles whose size is the number of households, and whose color is a share of them
            const sharesStyle = (shareColumn, color) => {
                return new gridviz.ShapeColorSizeStyle({
                    viewScale: sizeViewScale('men', 1.4, gridviz.powerScale(0.2)),
                    size: (c, r, z, vs) => vs.size(+c.men),
                    color: (c) => color(+c[shareColumn]),
                    shape: () => 'circle',
                    blendOperation: (z) => (z < 10 ? 'multiply' : 'source-over'),
                })
            }

            const stroke = () => new gridviz.StrokeStyle({ visible: (z) => z < 15 })
            const multiply = (limit) => (z) => (z < limit ? 'multiply' : 'source-over')

            //
            const update = () => {
                //read GUI selection
                const layCode = document.querySelector('#layer').value
                const year = document.querySelector('#year').value
                const geo = document.querySelector('#geo').value

                let layerDataset, styles, options
                if (layCode === 'pop') {
                    //population
                    const stretching = gridviz.logarithmicScale(-7)
                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: maxOf('ind'),
                        tFun: (c, r, z, max) => +c.ind / max,
                        color: d3.interpolateYlOrRd,
                        stretching: { fun: 'log', alpha: -7 },
                        blendOperation: multiply(20),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: "Nombre d'individus",
                            colorScale: d3.interpolateYlOrRd,
                            textScale: (t, max) => Math.round(max * stretching.invert(t)),
                            ticks: 5,
                        }),
                    ]
                    layerDataset = ds[geo].inc[year]
                    styles = [
                        style,
                        stroke(),
                        new gridviz.ShapeColorSizeStyle({
                            color: (c) => (+c.imputed ? '#666' : ''),
                            shape: () => 'circle',
                            size: (c, r) => 0.3 * r,
                            visible: (z) => z < 30,
                        }),
                    ]
                    options = {
                        minPixelsPerCell: 2,
                        cellInfoHTML: (c) => '<b>' + c.ind + '</b> individu' + (+c.ind == 1 ? '' : 's') + imputed(c),
                    }
                } else if (layCode === 'popAge') {
                    //population by age
                    const col = d3.interpolateSpectral
                    const style = compositionStyle(
                        {
                            ind_0_3: col(0 / 80),
                            ind_4_5: col(2 / 80),
                            ind_6_10: col(7 / 80),
                            ind_11_17: col(14 / 80),
                            ind_18_24: col(21 / 80),
                            ind_25_39: col(36 / 80),
                            ind_40_54: col(51 / 80),
                            ind_55_64: col(61 / 80),
                            ind_65_79: col(76 / 80),
                            ind_80p: col(1),
                        },
                        'agepyramid',
                        'ind',
                        1,
                        0.1,
                        { agePyramidHeight: (c, r) => 0.95 * r }
                    )
                    style.legends = [
                        new gridviz.ColorCategoryLegend({
                            title: 'Age',
                            colorLabel: [
                                [col(0 / 80), '<= 3'],
                                [col(2 / 80), '4-5'],
                                [col(7 / 80), '6-10'],
                                [col(14 / 80), '11-17'],
                                [col(21 / 80), '18-24'],
                                [col(36 / 80), '25-39'],
                                [col(51 / 80), '40-54'],
                                [col(61 / 80), '55-64'],
                                [col(76 / 80), '65-79'],
                                [col(1), ' > 80'],
                            ].reverse(),
                        }),
                    ]
                    layerDataset = ds[geo].ind[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 16,
                        cellInfoHTML: (c) =>
                            '<b>' +
                            c.ind +
                            '</b> individu' +
                            (+c.ind == 1 ? '' : 's') +
                            '<br>Par âge:<br> < 3 : ' +
                            c.ind_0_3 +
                            '<br> 4-5 : ' +
                            c.ind_4_5 +
                            '<br> 6-10: ' +
                            c.ind_6_10 +
                            '<br>11-17: ' +
                            c.ind_11_17 +
                            '<br>18-24: ' +
                            c.ind_18_24 +
                            '<br>25-39: ' +
                            c.ind_25_39 +
                            '<br>40-54: ' +
                            c.ind_40_54 +
                            '<br>55-64: ' +
                            c.ind_55_64 +
                            '<br>65-79: ' +
                            c.ind_65_79 +
                            '<br> > 80: ' +
                            c.ind_80p +
                            '<br> inc.: ' +
                            c.ind_inc +
                            imputed(c),
                    }
                } else if (layCode === 'popAge3') {
                    const col = d3.interpolateSpectral
                    const style = compositionStyle(
                        { ind_0_17: col(0.2), ind_18_64: col(0.4), ind_65p: col(0.9) },
                        'agepyramid',
                        'ind',
                        1,
                        0.1,
                        { agePyramidHeight: (c, r) => 0.95 * r }
                    )
                    style.legends = [
                        new gridviz.ColorCategoryLegend({
                            title: 'Age',
                            colorLabel: [
                                [col(0.2), '<= 17'],
                                [col(0.4), '18-64'],
                                [col(0.9), ' > 65'],
                            ].reverse(),
                        }),
                    ]
                    layerDataset = ds[geo].ind[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 11,
                        cellInfoHTML: (c) =>
                            '<b>' +
                            c.ind +
                            '</b> individu' +
                            (+c.ind == 1 ? '' : 's') +
                            '<br>Par âge:<br> < 17 : ' +
                            f1(c.ind_0_17) +
                            '<br> 18-64 : ' +
                            f1(c.ind_18_64) +
                            '<br> > 65: ' +
                            f1(c.ind_65p) +
                            '<br> inc.: ' +
                            f1(c.ind_inc) +
                            imputed(c),
                    }
                } else if (layCode === 'ageR') {
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: sizeViewScale('ind', 1.4, gridviz.powerScale(0.2)),
                        size: (c, r, z, vs) => vs.size(+c.ind),
                        color: (c) => d3.interpolateSpectral(1 - c.age_ratio),
                        shape: () => 'circle',
                        blendOperation: multiply(10),
                    })
                    style.legends = [
                        ...sizeLegends('ind', 'circle', 'individus'),
                        new gridviz.ColorLegend({
                            title: 'Equilibre jeunes/âgés',
                            ticks: 2,
                            colorScale: d3.interpolateSpectral,
                            textScale: (t) => (t == 0 ? 'Plus jeunes' : t == 0.5 ? 'équilibre' : 'Plus âgés'),
                        }),
                    ]
                    layerDataset = ds[geo].ind[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 6,
                        cellInfoHTML: (c) =>
                            '<b>' + f1(c.yyy) + '</b> 24 ans et moins<br><b>' + f1(c.ooo) + '</b> 65 ans et plus' + imputed(c),
                    }
                } else if (layCode === 'income') {
                    layerDataset = ds[geo].inc[year]
                    styles = [
                        new gridviz.SquareColorWebGLStyle({
                            color: d3.interpolateSpectral,
                            tFun: (c) => {
                                const t = (c.rIncome - 1200) / (3600 - 1200)
                                return 1 - Math.pow(t < 0 ? 0 : t, 1.5)
                            },
                            blendOperation: multiply(20),
                        }),
                        stroke(),
                    ]
                    options = {
                        minPixelsPerCell: 2,
                        cellInfoHTML: (c) =>
                            '<b>' + Math.floor(c.rIncome) + '€</b> par mois et par individu, en moyenne' + imputed(c),
                    }
                } else if (layCode === 'poverty') {
                    const style = sharesStyle('rPoverty', (v) => (!v ? '#bbb' : d3.interpolateYlOrRd(Math.pow(v, 0.65))))
                    style.legends = [
                        ...sizeLegends('men', 'circle', 'ménages'),
                        new gridviz.ColorLegend({
                            title: 'Part des ménages pauvres (%)',
                            ticks: 5,
                            colorScale: d3.interpolateYlOrRd,
                            textScale: (t) => Math.round(100 * Math.pow(t, 1 / 0.65)),
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 6,
                        cellInfoHTML: (c) =>
                            (c.rPoverty == 0 ? 'Pas' : '<b>' + f1(Math.floor(1000 * c.rPoverty) / 10) + '%</b>') +
                            ' de ménages pauvres<br>sur ' +
                            c.men +
                            ' ménage' +
                            (+c.men == 1 ? '' : 's') +
                            imputed(c),
                    }
                } else if (layCode === 'men_size') {
                    const style = compositionStyle(
                        { men_1ind: '#e31a1c', men_2_4ind: '#ffff99', men_5ind: '#1f78b4' },
                        'ring',
                        'men',
                        1.3,
                        0.15,
                        { stripesOrientation: () => 90 }
                    )
                    style.legends = [
                        ...sizeLegends('men', 'circle', 'ménages'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Taille des ménages',
                            colorLabel: [
                                ['#e31a1c', 'Un seul individu'],
                                ['#ffff99', '2 à 4 individus'],
                                ['#1f78b4', '5 individus ou plus'],
                            ],
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 10,
                        cellInfoHTML: (c) =>
                            c.men +
                            ' ménage' +
                            (+c.men == 1 ? '' : 's') +
                            '<br><b>' +
                            c.men_1ind +
                            "</b> d'un seul individu<br><b>" +
                            f1(c.men_2_4ind) +
                            '</b> de 2 à 4 individus<br><b>' +
                            c.men_5ind +
                            '</b> de 5 individus ou plus' +
                            imputed(c),
                    }
                } else if (layCode === 'men_mono') {
                    const style = sharesStyle('rMenFmp', (v) => (v == 0 ? '#ccc' : d3.interpolateYlOrRd(Math.pow(v, 0.4))))
                    style.legends = [
                        ...sizeLegends('men', 'circle', 'ménages'),
                        new gridviz.ColorLegend({
                            title: 'Part des ménages monoparentaux (%)',
                            ticks: 5,
                            colorScale: d3.interpolateYlOrRd,
                            textScale: (t) => Math.round(100 * Math.pow(t, 1 / 0.4)),
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 6,
                        cellInfoHTML: (c) =>
                            c.men +
                            ' ménage' +
                            (+c.men == 1 ? '' : 's') +
                            '<br><b>' +
                            c.men_fmp +
                            '</b> monoparenta' +
                            (+c.men_fmp == 1 ? 'l' : 'ux') +
                            '<br><b>' +
                            f1(100 * c.rMenFmp) +
                            '</b> %' +
                            imputed(c),
                    }
                } else if (layCode === 'men_owner') {
                    const style = sharesStyle('rMen_prop', (v) => d3.interpolatePuBuGn(1 - Math.pow(1 - v, 0.6)))
                    style.legends = [
                        ...sizeLegends('men', 'circle', 'ménages'),
                        new gridviz.ColorLegend({
                            title: 'Part des ménages propriétaires (%)',
                            ticks: 5,
                            colorScale: d3.interpolatePuBuGn,
                            textScale: (t) => Math.round(100 * (1 - Math.pow(1 - t, 1 / 0.6))),
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 6,
                        cellInfoHTML: (c) =>
                            c.men +
                            ' ménage' +
                            (+c.men == 1 ? '' : 's') +
                            '<br><b>' +
                            c.men_prop +
                            '</b> propriétaires<br><b>' +
                            f1(100 * c.rMen_prop) +
                            '</b> %' +
                            imputed(c),
                    }
                } else if (layCode === 'men_house_surf') {
                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => ({
                            min: d3.min(cells, (c) => c.rMenSurf),
                            max: d3.max(cells, (c) => c.rMenSurf),
                        }),
                        color: d3.interpolateSpectral,
                        tFun: (c, r, z, vs) => 1 - (c.rMenSurf - vs.min) / (vs.max - vs.min),
                        blendOperation: multiply(20),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Surface moyenne des logements de ménages (m²)',
                            ticks: 5,
                            colorScale: d3.interpolateSpectral,
                            textScale: (t, vs) => Math.round(vs.min + (1 - t) * (vs.max - vs.min)),
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style, stroke()]
                    options = {
                        minPixelsPerCell: 2,
                        cellInfoHTML: (c) =>
                            '<b>' +
                            f1(Math.floor(10 * c.rMenSurf) / 10) +
                            '</b> m² par logement.' +
                            c.men +
                            ' logement' +
                            (+c.men == 1 ? '' : 's') +
                            imputed(c),
                    }
                } else if (layCode === 'men_house_collective') {
                    const style = compositionStyle(
                        { men_coll: 'green', men_mais: 'orange' },
                        'flag',
                        'men',
                        1,
                        0.15,
                        { stripesOrientation: () => 90, blendOperation: multiply(10) }
                    )
                    style.legends = [
                        ...sizeLegends('men', 'square', 'ménages'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Type de logement',
                            colorLabel: [
                                ['green', 'Logement collectif'],
                                ['orange', 'Maison'],
                            ],
                        }),
                    ]
                    layerDataset = ds[geo].men[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 8,
                        cellInfoHTML: (c) =>
                            c.men +
                            ' ménage' +
                            (+c.men == 1 ? '' : 's') +
                            '<br><b>' +
                            (c.men_coll == 0 ? 'Aucun' : c.men_coll) +
                            '</b> en logement collectif<br><b>' +
                            (c.men_mais == 0 ? 'Aucun' : c.men_mais) +
                            '</b> en maison' +
                            imputed(c),
                    }
                } else if (layCode === 'log_age') {
                    const col = d3.interpolateViridis
                    const style = compositionStyle(
                        {
                            log_av45: col(0 / 3),
                            log_45_70: col(1 / 3),
                            log_70_90: col(2 / 3),
                            log_ap90: col(3 / 3),
                            log_inc: 'gray',
                        },
                        'flag',
                        'log',
                        1,
                        0.1,
                        { blendOperation: multiply(10) }
                    )
                    style.legends = [
                        ...sizeLegends('log', 'square', 'logements'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Année de construction',
                            colorLabel: [
                                [col(0 / 3), 'avant 1945'],
                                [col(1 / 3), 'entre 1945 et 1969'],
                                [col(2 / 3), 'entre 1970 et 1989'],
                                [col(3 / 3), 'depuis 1990'],
                                ['gray', 'inconnue'],
                            ],
                        }),
                    ]
                    layerDataset = ds[geo].log[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 8,
                        cellInfoHTML: (c) =>
                            f1(c.log) +
                            ' logement' +
                            (+c.log == 1 ? '' : 's') +
                            'Année de construction:<br><b>' +
                            c.log_av45 +
                            '</b> avant 1945<br><b>' +
                            c.log_45_70 +
                            '</b> entre 1945 et 1969<br><b>' +
                            c.log_70_90 +
                            '</b> entre 1970 et 1989<br><b>' +
                            c.log_ap90 +
                            '</b> depuis 1990<br><b>' +
                            c.log_inc +
                            '</b> inconnue' +
                            (+c.log_inc == 1 ? '' : 's') +
                            imputed(c),
                    }
                } else if (layCode === 'log_soc_nb') {
                    const style = compositionStyle(
                        { log_nsoc: '#ccc', log_soc: '#33a02c' },
                        'ring',
                        'log',
                        1.3,
                        0.15,
                        { blendOperation: multiply(10) }
                    )
                    style.legends = [
                        ...sizeLegends('log', 'circle', 'logements', '#fff'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Logement social',
                            colorLabel: [
                                ['#33a02c', 'logements sociaux'],
                                ['#ccc', 'autres logements'],
                            ],
                        }),
                    ]
                    layerDataset = ds[geo].log[year]
                    styles = [style]
                    options = {
                        minPixelsPerCell: 8,
                        cellInfoHTML: (c) =>
                            f1(c.log) +
                            ' logement' +
                            (+c.log == 1 ? '' : 's') +
                            '<b>' +
                            (c.log_soc == 0 ? 'Aucun' : c.log_soc) +
                            '</b> logement' +
                            (+c.log_soc == 1 ? '' : 's') +
                            ' social(ux)<br><b>' +
                            (c.log_nsoc == 0 ? 'Aucun' : f1(c.log_nsoc)) +
                            '</b> autre' +
                            (+c.log_nsoc == 1 ? '' : 's') +
                            imputed(c),
                    }
                } else if (layCode === 'log_soc_per') {
                    const style = new gridviz.SquareColorWebGLStyle({
                        color: d3.interpolatePuBuGn,
                        //no social housing: not drawn
                        tFun: (c) => (+c.rLogSoc == 0 ? undefined : c.rLogSoc),
                        blendOperation: multiply(20),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Part des logements sociaux (%)',
                            ticks: 5,
                            colorScale: d3.interpolatePuBuGn,
                            textScale: (t) => Math.round(100 * t),
                        }),
                    ]
                    layerDataset = ds[geo].log[year]
                    styles = [style, stroke()]
                    options = {
                        minPixelsPerCell: 2,
                        cellInfoHTML: (c) =>
                            (c.rLogSoc == 0 ? 'Pas' : '<b>' + f1(Math.floor(1000 * c.rLogSoc) / 10) + '%</b>') +
                            ' de logements sociaux.' +
                            imputed(c),
                    }
                } else {
                    console.error('Unexpected layer code: ' + layCode)
                    return
                }

                //the layers: the backgrounds, the data, then the boundaries and the labels
                map.layers = []
                if (document.querySelector('#background').checked) map.layers.push(...backgroundLayers)
                map.layers.push(new gridviz.GridLayer(layerDataset, styles, options))
                if (document.querySelector('#boundary').checked && boundaryLayer) map.layers.push(boundaryLayer)
                if (document.querySelector('#label').checked && labelLayer) map.layers.push(labelLayer)

                //redraw
                map.redraw()
            }

            const updateGeo = () => {
                //read GUI selection
                const geo = document.querySelector('#geo').value

                //set map parameters depending on the geographical selection

                //metropolitan france
                if (geo == 'met') {
                    map.setView(3760000, 2750000).setZoom(300)
                    boundaryLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())
                    labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('FR', '20'))
                    backgroundLayers = [
                        new gridviz.BackgroundLayer({
                            url: 'https://gisco-services.ec.europa.eu/maps/tiles/OSMPositronBackground/EPSG3035/',
                            resolutions: [
                                156543.03392804097, 78271.51696402048, 39135.75848201024, 19567.87924100512,
                                9783.93962050256, 4891.96981025128, 2445.98490512564, 1222.99245256282,
                                611.49622628141, 305.748113140705, 152.8740565703525, 76.43702828517625,
                                38.21851414258813, 19.109257071294063, 9.554628535647032, 4.777314267823516,
                                2.388657133911758, 1.19432856695, 0.597164283477939,
                            ],
                            origin: [0, 6000000],
                            visible: (z) => z < 50,
                        }),
                        new gridviz.BackgroundLayer({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/elevation_shading/',
                            resolutions: Array.from({ length: 9 }, (_, i) => 28.00132289714475 * Math.pow(2, 10 - i)),
                            origin: [0, 6000000],
                            filterColor: () => '#ffffff60',
                            visible: (z) => z >= 50,
                        }),
                    ]
                }

                //reunion
                else if (geo == 'reun') {
                    map.setView(350000, 7660000).setZoom(75)
                    backgroundLayers = [
                        new gridviz.BackgroundLayerImage({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/img/reunion_relief_100k.png',
                            xMin: 314686,
                            yMax: 7691260,
                            width: 64590.2,
                            height: 57178.2,
                        }),
                    ]
                    boundaryLayer = new gridviz.GeoJSONLayer(
                        gridviz_eurostat.getEurostatBoundariesLayer({ geo: 'RE', crs: '32740', scale: '01M' })
                    )
                    labelLayer = new gridviz.LabelLayer(
                        gridviz_eurostat.getEuronymeLabelLayer('RE', '20', {
                            //https://spatialreference.org/ref/epsg/wgs-84-utm-zone-40s/html/
                            proj: d3
                                .geoTransverseMercator()
                                .rotate([-57, 0])
                                .reflectY(true)
                                .scale(6378137)
                                .translate([500000, 10016000]),
                        })
                    )
                }

                //martinique
                else if (geo == 'mart') {
                    map.setView(710000, 1620000).setZoom(75)
                    backgroundLayers = [
                        new gridviz.BackgroundLayerImage({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/img/martinique_relief_100k.png',
                            xMin: 688835,
                            yMax: 1647753,
                            width: 49387.18,
                            height: 57962.4467,
                        }),
                    ]
                    boundaryLayer = new gridviz.GeoJSONLayer(
                        gridviz_eurostat.getEurostatBoundariesLayer({ geo: 'MQ', crs: '32620', scale: '01M' })
                    )
                    labelLayer = new gridviz.LabelLayer(
                        gridviz_eurostat.getEuronymeLabelLayer('MQ', '20', {
                            //https://spatialreference.org/ref/epsg/wgs-84-utm-zone-20n/html/
                            proj: d3
                                .geoTransverseMercator()
                                .rotate([63, 0])
                                .reflectY(true)
                                .scale(6378137)
                                .translate([500000, -11000]),
                        })
                    )
                } else {
                    console.error('Unexpected geo: ' + geo)
                    return
                }

                update()
            }

            //layer and year update
            document.querySelector('#layer').addEventListener('change', update)
            document.querySelector('#year').addEventListener('change', update)
            document.querySelector('#geo').addEventListener('change', updateGeo)

            // show/hide labels, boundaries and backgrounds
            document.querySelector('#label').addEventListener('change', update)
            document.querySelector('#boundary').addEventListener('change', update)
            document.querySelector('#background').addEventListener('change', update)

            //select layer and geography from URL
            let ls = gridviz.getParameterByName('lay')
            if (ls) {
                const layerSelect = document.querySelector('#layer')
                if (Array.from(layerSelect.options).some((option) => option.value === ls)) layerSelect.value = ls
            }
            ls = gridviz.getParameterByName('geo')
            if (ls) document.querySelector('#geo').value = ls

            updateGeo()
            map.setViewFromURL()
        </script>

        <div
            style="
                position: absolute;
                right: 0px;
                bottom: 0px;
                width: auto;
                height: auto;
                padding: 1px;
                border: 0px;
                background: #ffffffcc;
            "
        >
            <span style="font-size: 0.8em"
                ><a href="https://github.com/eurostat/gridviz" style="text-decoration: none">GridViz</a> | ©
                <a href="https://eurogeographics.org" style="text-decoration: none">EuroGeographics</a></span
            >
        </div>
    </body>
</html>
