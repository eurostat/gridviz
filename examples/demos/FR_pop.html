<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="maximum-scale=1.0, user-scalable=no" />
        <title>Carte de la population en France - INSEE Filosofi</title>
    </head>

    <body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">
        <div id="viz-container" style="height: 100%; width: 100%"></div>

        <div
            style="
                font-size: 0.9em;
                position: absolute;
                left: 10px;
                top: 10px;
                width: auto;
                height: auto;
                padding: 5px;
                border: 0px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 3px 3px 3px grey, -3px -3px 3px #ddd;
            "
        >
            <span style="font-size: 1.3em; font-weight: bold">Population en France</span><br />
            <div id="layer">
                Année:
                <select id="year">
                    <option value="2015">2015</option>
                    <option value="2017">2017</option>
                    <option value="2019" selected>2019</option>
                </select>
                <br />
                <input type="radio" name="layer" id="color" value="color" checked />
                <label for="color">Couleur</label>
                <br />
                <input type="radio" name="layer" id="colorDark" value="colorDark" />
                <label for="colorDark">Couleur sombre</label>
                <br />
                <input type="radio" name="layer" id="size" value="size" />
                <label for="size">Cercles proportionnels</label>
                <br />
                <input type="radio" name="layer" id="dots" value="dots" />
                <label for="dots">Nuage de points</label>
                <br />
                <input type="radio" name="layer" id="pillar" value="pillar" />
                <label for="pillar">Barres 3D</label>
                <br />
                <input type="radio" name="layer" id="joyplot" value="joyplot" />
                <label for="joyplot">Joyplot</label>
                <br />
                <input type="radio" name="layer" id="smoothed" value="smoothed" />
                <label for="smoothed">Lissage </label
                ><input
                    type="range"
                    min="3"
                    max="15"
                    value="6"
                    class="slider"
                    id="sigmaTK"
                    style="width: 100px"
                />
                <br />
                <span style="font-size: 1.3em; font-weight: bold">Changement</span>
                <br />
                <select id="chYears">
                    <option value="d2017_2019" selected>De 2017 à 2019</option>
                    <option value="d2015_2017">De 2015 à 2017</option>
                    <option value="d2015_2019">De 2015 à 2019</option>
                </select>
                <br />
                <input type="radio" name="layer" id="colorCh" value="colorCh" />
                <label for="colorCh">Couleur</label>
                <br />
                <input type="radio" name="layer" id="colorChSmTK" value="colorChSmTK" />
                <label for="colorChSmTK">Lissage </label
                ><input
                    type="range"
                    min="3"
                    max="15"
                    value="6"
                    class="slider"
                    id="sigmaCCH"
                    style="width: 100px"
                />
                <br />
                <input type="radio" name="layer" id="sizeCh" value="sizeCh" />
                <label for="sizeCh">Cercles proportionnels</label>
                <br />
                <input type="radio" name="layer" id="segmentCh" value="segmentCh" />
                <label for="segmentCh">Segments</label>
                <br />
                <input type="radio" name="layer" id="ts" value="ts" />
                <label for="ts">Série temporelle</label>
            </div>
            <hr />
            Géo:
            <select id="geo">
                <option value="met" selected>France métropolitaine</option>
                <option value="reun">Réunion</option>
                <option value="mart">Martinique</option>
            </select>
            <br />
            <input type="checkbox" id="label" checked />
            <label for="label">Noms villes</label>
            <input type="checkbox" id="boundary" checked />
            <label for="boundary">Limites adm.</label>
            <input type="checkbox" id="background" checked />
            <label for="background">Fond</label>
            <hr />
            Source:
            <a href="https://www.insee.fr/fr/statistiques/7655515" target="_blank" rel="noopener noreferrer"
                >INSEE - Filosofi - 200m</a
            >
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gridviz@3.5.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-parquet@1.2.1"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-smoothing@3.0.3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-format@3"></script>

        <script src="https://cdn.jsdelivr.net/npm/d3-scale@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-path@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-shape@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-selection@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-axis@3"></script>
        <script>
            //define map with initial view
            const map = new gridviz.Map(document.getElementById('viz-container'), {
                x: 3760000,
                y: 2650000,
                z: 900,
                zoomExtent: [3, 1500],
            }).addZoomButtons()

            const popDataset = {}

            //compute the change of population between two years
            const computeChange = (c, y1, y2) => {
                const y1_ = c['ind' + y1],
                    y2_ = c['ind' + y2]
                const k = 'd' + y1 + '_' + y2
                if (!y1_ && !y2_) c[k] = 0
                else if (!y1_ && y2_) c[k] = +y2_
                else if (y1_ && !y2_) c[k] = -y1_
                else c[k] = +y2_ - +y1_
                c['p' + y1 + '_' + y2] = y1_ == 0 ? 999 : c[k] / y1_
            }

            const getDataset = (geo) =>
                new gridviz.MultiResolutionDataset(
                    [200, 400, 600, 1000, 2000, 5000, 10000, 20000, 50000],
                    (r) =>
                        new gviz_par.TiledParquetGrid(
                            map,
                            'https://raw.githubusercontent.com/jgaffuri/tiled-grid-france-filosofi/main/out/parquet/' +
                                geo +
                                '/ts_ind/' +
                                r +
                                'm/'
                        ),
                    {
                        preprocess: (c) => {
                            computeChange(c, 2015, 2017)
                            computeChange(c, 2015, 2019)
                            computeChange(c, 2017, 2019)
                        },
                    }
                )
            popDataset.met = getDataset('met')
            popDataset.reun = getDataset('reun')
            popDataset.mart = getDataset('mart')

            //default color
            const col = '#e54f37'

            //the style which shows the imputed values with a grey dot
            const getStyleImputed = (year, mz = 30, sr = 0.25) =>
                new gridviz.ShapeColorSizeStyle({
                    color: (c) => (+c['imp' + year] ? '#666' : ''),
                    shape: () => 'circle',
                    size: (c, r) => sr * r,
                    visible: (z) => z < mz,
                })

            //the maximum of a column, in the view
            const maxOf = (column) => (cells) => d3.max(cells, (c) => +c[column])

            //a color ramp on a column, stretched on the GPU, with its legend
            const rampStyle = (column, ramp, opts) => {
                const stretching = gridviz.logarithmicScale(-7)
                const style = new gridviz.SquareColorWebGLStyle({
                    viewScale: maxOf(column),
                    tFun: (c, r, z, max) => +c[column] / max,
                    color: ramp,
                    stretching: { fun: 'log', alpha: -7 },
                    ...opts,
                })
                style.legends = [
                    new gridviz.ColorLegend({
                        title: "Nombre d'habitants",
                        width: 400,
                        ticks: 5,
                        colorScale: ramp,
                        textScale: (t, max) => Math.round(max * stretching.invert(t)),
                    }),
                ]
                return style
            }

            //the legends of widths of lines: some populations, as a share of the maximum of the view
            const widthLegends = (title, ks, widthOf) =>
                ks.map(
                    (k, i) =>
                        new gridviz.SizeLegend({
                            title: i == 0 ? title : undefined,
                            shape: 'line',
                            color: 'black',
                            length: (r) => r,
                            labelUnitText: 'hab.',
                            label: (max) => gridviz.nice(k * max),
                            size: (max, r, z) => widthOf(gridviz.nice(k * max), max, r, z),
                        })
                )

            //the background layers, depending on the geography
            let backgroundLayers = []
            let boundaryLayer, labelLayer

            //the tooltip: the population, and the change of the population
            const tooltipFun = (year_) => (c, r) => {
                const year = 'ind' + year_
                return +c[year]
                    ? '<b>' +
                          c[year] +
                          '</b> habitant' +
                          (+c[year] == 1 ? '' : 's') +
                          ' par ' +
                          (r * r) / 1000000 +
                          'km²' +
                          (+c['imp' + year_] && r < 1000 ? '<br>(valeur imputée)' : '')
                    : undefined
            }

            const update = () => {
                //read GUI selection
                const layCode = document.querySelector('input[name="layer"]:checked').value
                const year_ = document.querySelector('#year').value
                const year = 'ind' + year_
                const chYears = document.querySelector('#chYears').value
                const y1 = chYears.split('_')[0].replace('d', ''),
                    y2 = chYears.split('_')[1]
                const geo = document.querySelector('#geo').value

                const tooltipFunCh = (c) =>
                    y1 +
                    ': ' +
                    c['ind' + y1] +
                    '<br>' +
                    y2 +
                    ': ' +
                    c['ind' + y2] +
                    '<br><b>' +
                    (c[chYears] == 0
                        ? 'Pas de changement'
                        : (c[chYears] > 0 ? '+' : '') + c[chYears] + ' habitants') +
                    '</b>'

                //the filter of the background layers, and the color of the map
                for (let bgl of backgroundLayers) bgl.filterColor = (z) => (z > 50 ? '#ffffff60' : 'none')
                map.setBackgroundColor('white')

                let styles, options
                if (layCode == 'color') {
                    const colR = d3.interpolateOrRd
                    styles = [
                        rampStyle(year, colR, { blendOperation: (z) => (z < 25 ? 'multiply' : 'source-over') }),
                        new gridviz.StrokeStyle({
                            strokeColor: (c) => (+c[year] ? '#666' : ''),
                            visible: (z) => z < 15,
                        }),
                        getStyleImputed(year_),
                    ]
                    options = { minPixelsPerCell: 1.8, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'colorDark') {
                    const colR = d3.interpolateMagma

                    for (let bgl of backgroundLayers) bgl.filterColor = () => '#000000c0'
                    map.setBackgroundColor('black')

                    styles = [
                        rampStyle(year, colR),
                        new gridviz.StrokeStyle({
                            strokeColor: (c) => (+c[year] ? '#999' : ''),
                            visible: (z) => z < 15,
                        }),
                        getStyleImputed(year_),
                    ]
                    options = { minPixelsPerCell: 1.8, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'size') {
                    const p03 = gridviz.powerScale(0.3)
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells, resolution) => {
                            const max = d3.max(cells, (c) => +c[year])
                            return { size: (v) => 1.5 * resolution * p03(v / max), max: max }
                        },
                        color: () => col,
                        size: (c, r, z, vs) => vs.size(+c[year]),
                        shape: () => 'circle',
                        blendOperation: () => 'multiply',
                    })
                    style.legends = [0.8, 0.25, 0.02].map((k, i) =>
                        new gridviz.SizeLegend({
                            title: i == 0 ? "Nombre d'habitants" : undefined,
                            shape: 'circle',
                            fillColor: col,
                            label: (vs) => gridviz.nice(k * vs.max),
                            size: (vs, r, z) => vs.size(gridviz.nice(k * vs.max)),
                        }).style('padding', '0px 5px')
                    )
                    styles = [style]
                    options = { minPixelsPerCell: 5, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'dots') {
                    styles = [
                        new gridviz.DotDensityStyle({
                            viewScale: maxOf(year),
                            dotNumber: (c, r, z, max) => (((10 * r * r) / (z * z)) * +c[year]) / max,
                            dotSize: (r, z) => 1.2 * z,
                            color: () => col,
                        }),
                    ]
                    options = { minPixelsPerCell: 5, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'pillar') {
                    const stretching = gridviz.logarithmicScale(-5)
                    styles = [
                        new gridviz.PillarStyle({
                            viewScale: maxOf(year),
                            height: (c, r, z, max) => 10 * r * stretching(+c[year] / max),
                            color: () => col + 'aa',
                            simple: () => true,
                            viewHeightFactor: 1,
                        }),
                    ]
                    options = { minPixelsPerCell: 6, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'joyplot') {
                    styles = [
                        new gridviz.JoyPlotStyle({
                            viewScale: maxOf(year),
                            height: (c, r, z, max) => 5 * r * Math.sqrt(+c[year] / max),
                            fillColor: () => col + 'bb',
                        }),
                    ]
                    options = { minPixelsPerCell: 5, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'smoothed') {
                    const sigma = document.querySelector('#sigmaTK').value
                    const nb = 8
                    const colR = d3.interpolateOrRd
                    const stretching = gridviz.logarithmicScale(-7)

                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: maxOf('ksmval'),
                        tFun: (c, r, z, max) => Math.floor(nb * stretching(c.ksmval / max)) / nb,
                        color: colR,
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: "Nombre d'habitants",
                            colorScale: (t) => colR(Math.floor(t * nb) / nb),
                            width: 200,
                            ticks: 2,
                            textScale: (t) => (t == 0 ? 'Bas' : t == 1 ? 'Haut' : 'X'),
                        }),
                    ]
                    styles = [
                        new gridviz_smoothing.KernelSmoothingStyle({
                            value: (c) => +c[year],
                            filter: (c) => +c[year] > 0,
                            sigma: (r, z) => (r * sigma) / 10,
                            filterSmoothed: (v) => v > 0.02,
                            factor: 2,
                            styles: [style],
                            blendOperation: () => 'multiply',
                        }),
                    ]
                    options = { minPixelsPerCell: 6, cellInfoHTML: tooltipFun(year_) }
                } else if (layCode == 'colorCh') {
                    const streC = 0.22
                    const stre = gridviz.powerScale(streC)

                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells) => ({
                            min: d3.min(cells, (c) => +c[chYears]),
                            max: d3.max(cells, (c) => +c[chYears]),
                        }),
                        color: (c, r, z, vs) => {
                            const v = +c[chYears]
                            let t = 0.5
                            if (vs.min < 0 && v < 0) t -= stre(v / vs.min) / 2
                            else t += stre(v / vs.max) / 2
                            return d3.interpolateSpectral(1 - t)
                        },
                        shape: () => 'square',
                        blendOperation: (z) => (z < 25 ? 'multiply' : 'source-over'),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Changement de population de ' + y1 + ' à ' + y2 + ", en nombre d'habitants",
                            ticks: 7,
                            width: 500,
                            colorScale: d3.interpolateSpectral,
                            invert: true,
                            textScale: (t, vs) => {
                                if (t < 0.5) return Math.round(vs.min * stre.invert(1 - 2 * t))
                                if (t > 0.5) return Math.round(vs.max * stre.invert(2 * t - 1))
                                return 0
                            },
                        }),
                    ]
                    styles = [style, new gridviz.StrokeStyle({ visible: (z) => z < 15 })]
                    options = { minPixelsPerCell: 2, cellInfoHTML: tooltipFunCh }
                } else if (layCode == 'colorChSmTK') {
                    const colR = d3.interpolateSpectral
                    const nb = 25
                    const stre = gridviz.powerScale(0.3)
                    const sigma = document.querySelector('#sigmaCCH').value

                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => ({
                            min: d3.min(cells, (c) => c.ksmval),
                            max: d3.max(cells, (c) => c.ksmval),
                        }),
                        color: (t) => colR(1 - t),
                        tFun: (c, r, z, vs) => {
                            const v = c.ksmval
                            let t = 0.5
                            if (vs.min < 0 && v < 0) t += stre(v / vs.min) / 2
                            else t -= stre(v / vs.max) / 2
                            t = 1 - t
                            return Math.floor(t * nb) / nb
                        },
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Changement de population de ' + y1 + ' à ' + y2,
                            width: 300,
                            ticks: 3,
                            colorScale: (t) => colR(1 - Math.floor(t * nb) / nb),
                            textScale: (t) => (t == 0 ? 'Baisse' : t == 1 ? 'Hausse' : 'Stabilité'),
                        }),
                    ]
                    styles = [
                        new gridviz_smoothing.KernelSmoothingStyle({
                            value: (c) => +c[chYears],
                            sigma: (r, z) => (r * sigma) / 10,
                            factor: 2,
                            filterSmoothed: (v) => Math.abs(v) > 0.0001,
                            styles: [style],
                            blendOperation: () => 'multiply',
                        }),
                    ]
                    options = { minPixelsPerCell: 6, cellInfoHTML: tooltipFunCh }
                } else if (layCode == 'sizeCh') {
                    const p02 = gridviz.powerScale(0.2)
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells, resolution) => {
                            const max = d3.max(cells, (c) => Math.abs(c[chYears]))
                            return { size: (v) => 1.5 * resolution * p02(Math.abs(v) / max), max: max }
                        },
                        color: (c) => (c[chYears] > 0 ? '#d13c4b' : '#4288b5'),
                        size: (c, r, z, vs) => vs.size(+c[chYears]),
                        shape: () => 'circle',
                        blendOperation: () => 'multiply',
                    })
                    style.legends = [
                        ...[0.9, 0.2, 0.01].map((k, i) =>
                            new gridviz.SizeLegend({
                                title: i == 0 ? 'Changement de population ' + y1 + '-' + y2 : undefined,
                                shape: 'circle',
                                labelUnitText: i == 0 ? 'habitants' : '',
                                fillColor: 'gray',
                                label: (vs) => gridviz.nice(k * vs.max),
                                size: (vs) => vs.size(gridviz.nice(k * vs.max)),
                            }).style('padding', '0px 5px')
                        ),
                        new gridviz.ColorCategoryLegend({
                            shape: 'square',
                            colorLabel: [
                                ['#d13c4b', 'Hausse'],
                                ['#4288b5', 'Baisse'],
                            ],
                        }),
                    ]
                    styles = [style]
                    options = { minPixelsPerCell: 6, cellInfoHTML: tooltipFunCh }
                } else if (layCode == 'segmentCh') {
                    const maxAngle = 60
                    const per = 'p' + y1 + '_' + y2
                    const p025 = gridviz.powerScale(0.25)
                    const widthOf = (v, max, r) => 0.8 * r * p025(v / max)

                    const style = new gridviz.SegmentStyle({
                        viewScale: maxOf('ind' + y2),
                        orientation: (c) => {
                            let a = (c[per] * maxAngle) / 0.3
                            return a < -maxAngle ? -maxAngle : a > maxAngle ? maxAngle : a
                        },
                        color: (c) => {
                            const v = c[per]
                            return Math.abs(v) < 0.02 ? 'gray' : v > 0 ? '#d13c4b' : '#4288b5'
                        },
                        length: (c, r) => r,
                        width: (c, r, z, max) => widthOf(+c['ind' + y2], max, r),
                        blendOperation: () => 'multiply',
                    })
                    style.legends = [
                        ...widthLegends('Population en ' + y2, [0.8, 0.2, 0.05], widthOf),
                        new gridviz.OrientationLegend({
                            title: 'Changement de population ' + y1 + '-' + y2,
                            label: 'Forte hausse',
                            color: () => '#d13c4b',
                            orientation: 60,
                        }),
                        new gridviz.OrientationLegend({ label: 'Faible hausse', color: () => '#d13c4b', orientation: 30 }),
                        new gridviz.OrientationLegend({ label: 'Stabilité (<1%)', color: () => 'gray', orientation: 0 }),
                        new gridviz.OrientationLegend({ label: 'Faible baisse', color: () => '#4288b5', orientation: -30 }),
                        new gridviz.OrientationLegend({ label: 'Forte baisse', color: () => '#4288b5', orientation: -60 }),
                    ]
                    styles = [style]
                    options = { minPixelsPerCell: 10, cellInfoHTML: tooltipFunCh }
                } else if (layCode == 'ts') {
                    const ts = ['ind2015', 'ind2017', 'ind2019']
                    const p04 = gridviz.powerScale(0.4)

                    const style = new gridviz.TimeSeriesStyle({
                        ts: ts,
                        color: () => 'black',
                        viewScale: maxOf('ind2019'),
                        lineWidth: (c, r, z, max) => (1 + p04(+c.ind2019 / max) * 4) * z,
                    })
                    style.legends = widthLegends(
                        'Population en 2019',
                        [0.8, 0.2, 0.05],
                        (v, max, r, z) => (1 + p04(v / max) * 4) * z
                    )
                    styles = [style]
                    options = {
                        minPixelsPerCell: 10,
                        cellInfoHTML: (c) => {
                            //prepare chart data
                            const tsdata = []
                            for (let d of ts) tsdata.push({ year: +d.replace('ind', ''), pop: +c[d] })

                            const maxPop = d3.max(tsdata, (d) => d.pop)

                            const w = 300
                            const h = 250
                            const marginTop = 5
                            const marginRight = 2
                            const marginBottom = 20
                            const marginLeft = 10 + 8 * (maxPop + '').length

                            //x scale
                            const x = d3.scaleLinear(
                                d3.extent(tsdata, (d) => d.year),
                                [marginLeft, w - marginRight]
                            )

                            //y scale
                            const y = d3.scaleLinear([0, maxPop], [h - marginBottom, marginTop])

                            //make div and svg
                            const div = d3.create('div')
                            const svg = div
                                .append('svg')
                                .attr('width', w)
                                .attr('height', h)
                                .attr('viewBox', [0, 0, w, h])
                                .attr('style', 'max-width: 100%; height: auto; height: intrinsic;')

                            //x-axis.
                            svg.append('g')
                                .attr('transform', `translate(0,${h - marginBottom})`)
                                .call(
                                    d3
                                        .axisBottom(x)
                                        .ticks(w / 80)
                                        .tickSizeOuter(0)
                                        .tickFormat((d) => '' + d)
                                )

                            //y-axis
                            svg.append('g')
                                .attr('transform', `translate(${marginLeft},0)`)
                                .call(d3.axisLeft(y).ticks(h / 40))

                            //draw line
                            const line = d3
                                .line()
                                .x((d) => x(d.year))
                                .y((d) => y(d.pop))
                            svg.append('path')
                                .attr('stroke-width', 2)
                                .attr('stroke', 'black')
                                .attr('fill', 'none')
                                .attr('d', line(tsdata))

                            return div.html()
                        },
                    }
                } else {
                    console.error('Unexpected layer code: ' + layCode)
                    return
                }

                //the layers: the backgrounds, the data, then the boundaries and the labels
                map.layers = []
                if (document.querySelector('#background').checked) map.layers.push(...backgroundLayers)
                map.layers.push(new gridviz.GridLayer(popDataset[geo], styles, options))
                if (document.querySelector('#boundary').checked && boundaryLayer) map.layers.push(boundaryLayer)
                if (document.querySelector('#label').checked && labelLayer) map.layers.push(labelLayer)

                //redraw
                map.redraw()
            }

            const updateGeo = () => {
                //read GUI selection
                const geo = document.querySelector('#geo').value

                //set map parameters depending on the geographical selection

                //metropolitan france
                if (geo == 'met') {
                    map.setView(3760000, 2650000).setZoom(900)
                    boundaryLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())
                    labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('FR', '20'))
                    backgroundLayers = [
                        new gridviz.BackgroundLayer({
                            url: 'https://gisco-services.ec.europa.eu/maps/tiles/OSMPositronBackground/EPSG3035/',
                            resolutions: [
                                156543.03392804097, 78271.51696402048, 39135.75848201024, 19567.87924100512,
                                9783.93962050256, 4891.96981025128, 2445.98490512564, 1222.99245256282,
                                611.49622628141, 305.748113140705, 152.8740565703525, 76.43702828517625,
                                38.21851414258813, 19.109257071294063, 9.554628535647032, 4.777314267823516,
                                2.388657133911758, 1.19432856695, 0.597164283477939,
                            ],
                            origin: [0, 6000000],
                            visible: (z) => z < 50,
                        }),
                        new gridviz.BackgroundLayer({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/elevation_shading/',
                            resolutions: Array.from({ length: 9 }, (_, i) => 28.00132289714475 * Math.pow(2, 10 - i)),
                            origin: [0, 6000000],
                            visible: (z) => z >= 50,
                        }),
                    ]
                }

                //reunion
                else if (geo == 'reun') {
                    map.setView(350000, 7660000).setZoom(75)
                    backgroundLayers = [
                        new gridviz.BackgroundLayerImage({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/img/reunion_relief_100k.png',
                            xMin: 314686,
                            yMax: 7691260,
                            width: 64590.2,
                            height: 57178.2,
                        }),
                    ]
                    boundaryLayer = new gridviz.GeoJSONLayer(
                        gridviz_eurostat.getEurostatBoundariesLayer({ geo: 'RE', crs: '32740', scale: '01M' })
                    )
                    labelLayer = new gridviz.LabelLayer(
                        gridviz_eurostat.getEuronymeLabelLayer('RE', '20', {
                            //https://spatialreference.org/ref/epsg/wgs-84-utm-zone-40s/html/
                            proj: d3
                                .geoTransverseMercator()
                                .rotate([-57, 0])
                                .reflectY(true)
                                .scale(6378137)
                                .translate([500000, 10016000]),
                        })
                    )
                }

                //martinique
                else if (geo == 'mart') {
                    map.setView(710000, 1620000).setZoom(75)
                    backgroundLayers = [
                        new gridviz.BackgroundLayerImage({
                            url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/img/martinique_relief_100k.png',
                            xMin: 688835,
                            yMax: 1647753,
                            width: 49387.18,
                            height: 57962.4467,
                        }),
                    ]
                    boundaryLayer = new gridviz.GeoJSONLayer(
                        gridviz_eurostat.getEurostatBoundariesLayer({ geo: 'MQ', crs: '32620', scale: '01M' })
                    )
                    labelLayer = new gridviz.LabelLayer(
                        gridviz_eurostat.getEuronymeLabelLayer('MQ', '20', {
                            //https://spatialreference.org/ref/epsg/wgs-84-utm-zone-20n/html/
                            proj: d3
                                .geoTransverseMercator()
                                .rotate([63, 0])
                                .reflectY(true)
                                .scale(6378137)
                                .translate([500000, -11000]),
                        })
                    )
                } else {
                    console.error('Unexpected geo: ' + geo)
                    return
                }

                update()
            }

            //layer and year update
            document.querySelector('#layer').addEventListener('change', update)
            document.querySelector('#year').addEventListener('change', update)
            document.querySelector('#geo').addEventListener('change', updateGeo)

            //smoothing parameters
            document.getElementById('sigmaTK').oninput = update
            document.getElementById('sigmaCCH').oninput = update

            // show/hide labels, boundaries and backgrounds
            document.querySelector('#label').addEventListener('change', update)
            document.querySelector('#boundary').addEventListener('change', update)
            document.querySelector('#background').addEventListener('change', update)

            //select layer and geography from URL
            let ls = gridviz.getParameterByName('lay')
            if (ls) {
                const b = document.querySelector('#' + ls)
                if (b) b.checked = true
            }
            ls = gridviz.getParameterByName('geo')
            if (ls) document.querySelector('#geo').value = ls

            updateGeo()
            map.setViewFromURL()
        </script>

        <div
            style="
                position: absolute;
                right: 0px;
                bottom: 0px;
                width: auto;
                height: auto;
                padding: 1px;
                border: 0px;
                background: #ffffffcc;
            "
        >

                <a
                    target="_blank"
                    rel="nofollow noreferrer noopener"
                    href="https://www.tuik.gov.tr"
                    style="text-decoration: none"
                    >Turkstat</a
                >
            </span>
        </div>
    </body>
