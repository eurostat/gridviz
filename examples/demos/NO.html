<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="maximum-scale=1.0, user-scalable=no" />
        <title>Gridviz - example</title>
    </head>

    <body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">
        <div id="viz-container" style="height: 100%; width: 100%"></div>

        <div
            style="
                position: absolute;
                left: 20px;
                top: 20px;
                width: auto;
                height: auto;
                padding: 10px;
                border: 0px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 5px 5px 5px grey;
            "
        >
            <div id="layer">
                <span style="font-size: 1.5em; font-weight: bold"
                    >Population in
                    <select id="year"></select
                ></span>
                <br />
                <span style="font-size: 1.2em">
                    <input type="radio" name="layer" id="pop" value="pop" checked />
                    <label for="pop">Total population</label>
                    <br />
                    <input type="radio" name="layer" id="popS" value="popS" />
                    <label for="popS">Smoothed</label>
                    <input type="range" min="3" max="30" value="10" class="slider" id="sigma" />
                    <br />
                    <input type="radio" name="layer" id="popSex" value="popSex" />
                    <label for="popSex">by sex</label>
                    <br />
                    <input type="radio" name="layer" id="popAge" value="popAge" />
                    <label for="popAge">by age (?)</label>
                    <br />
                </span>
                <span style="font-size: 1.5em; font-weight: bold">Population change</span>
                <br />
                <span style="font-size: 1.2em">
                    <input type="radio" name="layer" id="popTS" value="popTS" />
                    <label for="popTS">Population time series</label>
                    <br />
                </span>
            </div>
            <span style="font-size: 1.2em">
                <hr />
                <input type="checkbox" id="label" checked />
                <label for="label">City names</label>
                <input type="checkbox" id="boundary" checked />
                <label for="boundary">Boundaries</label>
                <hr />
                Source:
                <a
                    href="https://www.ssb.no/natur-og-miljo/areal/artikler/kart-og-geodata-fra-ssb"
                    style="text-decoration: none"
                    >Statistisk sentralbyrå, Statistics Norway</a
                >
            </span>
        </div>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-smoothing@3.0.3"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-format@3"></script>

        <script src="https://cdn.jsdelivr.net/npm/d3-time@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-time-format@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-path@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-shape@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-selection@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-axis@3"></script>

        <script>
            //define map projection for Norway
            //UTM zone 33 with datum WGS 84
            //https://spatialreference.org/ref/epsg/32633/html/
            const proj = d3
                .geoTransverseMercator()
                .rotate([-15, 0])
                //.reflectX(false)
                .reflectY(true)
                .scale(6378137) //0.9996
                .translate([2500000, -27000])

            //define map with initial view
            const map = new gridviz.Map(document.getElementById('viz-container'), {
                x: 2179500,
                y: 6783250,
                z: 500,
            }).addZoomButtons()

            //labels and boundaries
            const labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('NO', '20', { proj: proj }))
            const boundaryLayer = new gridviz.GeoJSONLayer(
                gridviz_eurostat.getEurostatBoundariesLayer({ crs: '4326', nutsYear: '2021', proj: proj })
            )

            //fill years list
            for (let y = 2001; y <= 2022; y++) {
                const option = document.createElement('option')
                option.text = y
                option.value = y
                document.getElementById('year').add(option)
            }
            //select 2018
            document.getElementById('year').value = '2018'

            //prepare datasets dictionnary, indexed by thematic domain
            const ds = {}
            const baseURL = 'https://raw.githubusercontent.com/jgaffuri/tiled-grid-norway/main/out/'

            //generic function to make multi-resolution dataset for Norway
            const makeDataset = (code, short, preprocess) =>
                new gridviz.MultiResolutionDataset(
                    short
                        ? [1000, 2000, 5000, 10000, 20000, 50000, 100000]
                        : [250, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000],
                    (r) => new gridviz.TiledGrid(map, baseURL + code + 'csv/' + r + 'm/'),
                    { preprocess: preprocess }
                )

            //make population datasets, by year
            for (let y = 2001; y <= 2022; y++) {
                ds['pop' + y] = makeDataset('pop' + y)
                ds['popf' + y] = makeDataset('pop' + y, true, (c) => {
                    //sex
                    c.Isex = c.m - c.f
                    c.Isex = (100 * c.Isex) / c.p
                    if (isNaN(c.Isex)) c.Isex = 0

                    //average age ?
                    c.aa = +c.ta / +c.p
                })
            }

            //make population timeseries dataset
            ds.popTS = makeDataset('popTS')

            //TODO style per gender, age. x,y,p,m,f,ta

            //
            const update = () => {
                //read GUI selection
                const layCode = document.querySelector('input[name="layer"]:checked').value

                //the layer of the data
                let gridLayer

                //set layer
                if (layCode === 'pop') {
                    //get selected year
                    const y = document.querySelector('#year').value

                    //the stretching of the population, with its inverse for the legend
                    const stretching = gridviz.logarithmicScale(-7)

                    //define style
                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => d3.max(cells, (c) => +c.p),
                        tFun: (c, r, z, max) => c.p / max,
                        color: d3.interpolateYlOrRd,
                        stretching: { fun: 'log', alpha: -7 },
                    })
                    //legend
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Population',
                            colorScale: d3.interpolateYlOrRd,
                            textScale: (t, max) => Math.round(max * stretching.invert(t)),
                            ticks: 5,
                        }),
                    ]

                    gridLayer = new gridviz.GridLayer(
                        //set dataset: population dataset on year y
                        ds['pop' + y],
                        [
                            style,
                            //show stroke for low resolutions
                            new gridviz.StrokeStyle({ visible: (z) => z < 7 }),
                        ],
                        {
                            minPixelsPerCell: 1.5,
                            cellInfoHTML: (c) => '<b>' + c.p + '</b> person' + (+c.p == 1 ? '' : 's'),
                        }
                    )
                } else if (layCode === 'popS') {
                    //get selected year
                    const y = document.querySelector('#year').value

                    //get smoothing sigma
                    const sig = document.querySelector('#sigma').value

                    //define color ramp and number of classes
                    const colR = d3.interpolateYlOrRd
                    const nb = 5
                    const stretching = gridviz.logarithmicScale(-10)

                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => d3.max(cells, (c) => +c.ksmval),
                        tFun: (c, r, z, max) => {
                            const v_ = stretching(c.ksmval / max)
                            return Math.floor(nb * v_) / nb
                        },
                        color: colR,
                    })
                    //legend
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Population',
                            colorScale: (t) => colR(Math.floor(t * nb) / nb),
                            width: 200,
                            ticks: 2,
                            textScale: (t) => (t == 0 ? 'Low' : t == 1 ? 'High' : 'X'),
                        }),
                    ]

                    gridLayer = new gridviz.GridLayer(
                        //set dataset: population dataset on year y
                        ds['pop' + y],
                        [
                            new gridviz_smoothing.KernelSmoothingStyle({
                                value: (c) => +c.p,
                                filterSmoothed: (v) => v > 0.001,
                                sigma: (r, z) => (r * +sig) / 10,
                                factor: 2,
                                styles: [style],
                            }),
                        ],
                        {
                            minPixelsPerCell: 1.5,
                            cellInfoHTML: (c) => '<b>' + c.p + '</b> person' + (+c.p == 1 ? '' : 's'),
                        }
                    )
                } else if (layCode === 'popSex') {
                    const fs = d3.format('.1f')

                    //get selected year
                    const y = document.querySelector('#year').value

                    const sizeStretching = gridviz.powerScale(0.2)

                    //the scale of the view: the sizes of the circles and the maximum of the difference of the sexes
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells, resolution) => {
                            const maxP = d3.max(cells, (c) => +c.p)
                            const maxI = d3.max(cells, (c) => Math.abs(c.Isex))
                            return {
                                size: (p) => 1.3 * resolution * sizeStretching(p / maxP),
                                maxI: maxI,
                            }
                        },
                        color: (c, r, z, vs) => {
                            const t = (Math.sign(c.Isex) * gridviz.powerScale(0.2)(Math.abs(c.Isex) / vs.maxI)) / 2 + 0.5
                            return d3.interpolateSpectral(1 - t)
                        },
                        shape: () => 'circle',
                        size: (c, r, z, vs) => vs.size(+c.p),
                        blendOperation: (z) => (z < 4 ? 'multiply' : 'source-over'),
                    })
                    //legends
                    style.legends = [
                        ...gridviz.sizeLegendViewScale((c) => +c.p, {
                            shape: 'circle',
                            labelUnitText: 'inhab.',
                            fillColor: '#ccc',
                            viewScaleFun: (vs) => vs.size,
                            k: [0.9, 0.2, 0.05],
                        }),
                        new gridviz.ColorLegend({
                            title: 'Men / women difference',
                            ticks: 3,
                            textScale: (t) => (t == 0 ? 'More women' : t == 0.5 ? 'Balanced' : 'More men'),
                            colorScale: d3.interpolateSpectral,
                            invert: true,
                        }),
                    ]

                    gridLayer = new gridviz.GridLayer(ds['popf' + y], [style], {
                        minPixelsPerCell: 8,
                        cellInfoHTML: (c) => {
                            return (
                                c.m +
                                ' men<br>' +
                                c.f +
                                ' women<br>Difference: <b>' +
                                (c.Isex > 0 ? '+' : '') +
                                fs(c.Isex) +
                                ' % men</b>'
                            )
                        },
                    })
                } else if (layCode === 'popAge') {
                    //get selected year
                    const y = document.querySelector('#year').value

                    //age
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells, resolution) => {
                            const maxP = d3.max(cells, (c) => +c.p)
                            return {
                                size: (p) => 1.4 * resolution * Math.pow(p / maxP, 0.2),
                                minAge: d3.min(cells, (c) => c.aa),
                                maxAge: d3.max(cells, (c) => c.aa),
                            }
                        },
                        size: (c, r, z, vs) => vs.size(+c.p),
                        color: (c, r, z, vs) => {
                            if (c.aa == 0) return 'gray'
                            const t = (c.aa - vs.minAge) / (vs.maxAge - vs.minAge)
                            return d3.interpolateSpectral(t)
                        },
                        shape: () => 'circle',
                    })

                    gridLayer = new gridviz.GridLayer(ds['popf' + y], [style], { minPixelsPerCell: 6 })
                } else if (layCode === 'popTS') {
                    //define time series list of years
                    const ts = []
                    for (let i = 2002; i <= 2022; i++) ts.push('y' + i)

                    //define style
                    const style = new gridviz.TimeSeriesStyle({
                        ts: ts,
                        color: () => 'black',
                        //the width of the lines follows the population of 2018
                        viewScale: (cells) => d3.max(cells, (c) => +c.y2018),
                        lineWidth: (c, r, z, max) => (1 + Math.pow(+c.y2018 / max, 0.4) * 4) * z,
                    })
                    //legend: lines of the width of some populations, as a share of the maximum of the view
                    style.legends = [0.8, 0.2, 0.05, 0.01].map(
                        (k, i) =>
                            new gridviz.SizeLegend({
                                title: i == 0 ? 'Population (2018)' : undefined,
                                shape: 'line',
                                color: 'black',
                                length: (r) => r,
                                labelUnitText: 'inhabitants',
                                label: (max) => gridviz.nice(k * max),
                                size: (max, r, z) => (1 + Math.pow(gridviz.nice(k * max) / max, 0.4) * 4) * z,
                            })
                    )

                    //add layer
                    gridLayer = new gridviz.GridLayer(
                        //use dataset on population time series
                        ds.popTS,
                        [style],
                        {
                            minPixelsPerCell: 10,
                            cellInfoHTML: (c) => {
                                //prepare chart data
                                const tsdata = []
                                for (let d of ts) tsdata.push({ year: +d.replace('y', ''), pop: +c[d] })

                                const maxPop = d3.max(tsdata, (d) => d.pop)

                                const w = 300
                                const h = 250
                                const marginTop = 5
                                const marginRight = 2
                                const marginBottom = 20
                                const marginLeft = 10 + 8 * (maxPop + '').length

                                //x scale
                                const x = d3.scaleLinear(
                                    d3.extent(tsdata, (d) => d.year),
                                    [marginLeft, w - marginRight]
                                )

                                //y scale
                                const y = d3.scaleLinear([0, maxPop], [h - marginBottom, marginTop])

                                //make div and svg
                                const div = d3.create('div')
                                const svg = div
                                    .append('svg')
                                    .attr('width', w)
                                    .attr('height', h)
                                    .attr('viewBox', [0, 0, w, h])
                                    .attr('style', 'max-width: 100%; height: auto; height: intrinsic;')

                                //x-axis.
                                svg.append('g')
                                    .attr('transform', `translate(0,${h - marginBottom})`)
                                    .call(
                                        d3
                                            .axisBottom(x)
                                            .ticks(w / 80)
                                            .tickSizeOuter(0)
                                            .tickFormat((d) => '' + d)
                                    )

                                //y-axis
                                svg.append('g')
                                    .attr('transform', `translate(${marginLeft},0)`)
                                    .call(d3.axisLeft(y).ticks(h / 40))

                                //draw line
                                const line = d3
                                    .line()
                                    .x((d) => x(d.year))
                                    .y((d) => y(d.pop))
                                svg.append('path')
                                    .attr('stroke-width', 2)
                                    .attr('stroke', 'black')
                                    .attr('fill', 'none')
                                    .attr('d', line(tsdata))

                                return div.html()
                            },
                        }
                    )
                } else console.error('Unexpected layer code: ' + layCode)

                //the layers: the data, then the boundaries and the labels
                map.layers = [gridLayer]
                if (document.getElementById('boundary').checked) map.layers.push(boundaryLayer)
                if (document.getElementById('label').checked) map.layers.push(labelLayer)

                //redraw
                map.redraw()
            }

            //on layer selection change, update map
            document.getElementById('layer').addEventListener('change', update)
            //on year selection change, update map
            document.getElementById('year').addEventListener('change', update)
            //on sigma selection change, update map
            document.getElementById('sigma').oninput = update

            // show/hide labels
            document.getElementById('label').addEventListener('change', update)

            // show/hide boundaries
            document.querySelector('#boundary').addEventListener('change', update)

            //select layer from URL
            const ls = gridviz.getParameterByName('lay')
            if (ls) {
                const b = document.getElementById(ls)
                if (b) b.checked = true
            }

            //initialise
            update()
        </script>


        <div
            style="
                position: absolute;
                right: 0px;
                bottom: 0px;
                width: auto;
                height: auto;
                padding: 1px;
                border: 0px;
                background: #ffffffcc;
            "
        >
            <span style="font-size: 0.8em">
                <a href="https://github.com/eurostat/gridviz" style="text-decoration: none">GridViz</a> | ©<a
                    href="https://eurogeographics.org"
                    style="text-decoration: none"
                    >EuroGeographics</a
                ></span
            >
        </div>
    </body>
</html>
