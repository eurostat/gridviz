<!DOCTYPE html>
<html lang="en" style="height: 100%">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relief in Europe</title>
</head>

<body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">

    <div id="map" style="height: 100%; width: 100%"></div>

    <div id="control" style="
                font-size: 0.9em;
                position: absolute;
                left: 10px;
                top: 10px;
                width: auto;
                height: auto;
                padding: 5px;
                border: 0px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 3px 3px 3px grey, -3px -3px 3px #ddd;
            ">
        <form id="form">
            Relief:
            <label for="radio_hyps"><input type="radio" id="radio_hyps" name="rdreliefstyle" value="hyps"
                    checked>Hypsometric tints</label>
            <label for="radio_joyplot"><input type="radio" id="radio_joyplot" name="rdreliefstyle"
                    value="joyplot">Joyplot</label><br>
            <hr>
            <div>
                <label>Relief smoothing (slow)</label>
                <input type="range" min="0" max="10" value="0" step="0.25" id="sReliefSmoothing" style="width: 200px" />
                <br>
            </div>

            <div id="hyps_div">
                Hypsometric tints <select id="hypscol"></select><br>
                <label>Hypsometric tints number</label>
                <input type="range" min="2" max="50" value="20" step="1" id="sReliefNb" style="width: 200px" />
                <br>
                <label for="cbHypsDyn"><input type="checkbox" id="cbHypsDyn">Adjust hypsometric colors to min/max on
                    map</label>
                <br>
                <div id="refexhyps">
                    <label>Relief exageration<input type="range" min="-15" max="15" value="0" step="1"
                            id="sReliefExageration" style="width: 200px" /></label>
                </div>
                <br>
                <label for="cbHypssea"><input type="checkbox" id="cbHypssea">Adjust hypsometric colors to sea level
                    rise</label>
                <br>
                <label for="cbTanaka"><input type="checkbox" id="cbTanaka">Tanaka style (slow)</label>
            </div>

            <div id="joyplot_div" style="display: none;">
                <label>Relief exageration</label>
                <input type="range" min="1" max="20" value="10" step="1" id="sReliefExagerationJP"
                    style="width: 200px" />
            </div>
            <br>
            <label for="cbHillshading"><input type="checkbox" id="cbHillshading">Hillshading (slow)</label>

            <br>
            <label for="cbHillshadingRay"><input type="checkbox" id="cbHillshadingRay">Hillshading raycasting
                (slow)</label>
            <div id="rc_div" style="border: solid black 1px; padding: 1px;">
                <label>Sun ray azimuth</label>
                <input type="range" min="0" max="6.3" value="2.4" step="0.05" id="sunrayAzimuth" style="width: 200px" />
                <br>
                <label>Sun altitude</label>
                <input type="range" min="0.005" max="0.7" value="0.15" step="0.01" id="sunrayAltitude"
                    style="width: 200px" />
                <br>
                <label>Sun light opacity</label>
                <input type="range" min="0" max="1" value="0.33" step="0.01" id="sunrayAlpha" style="width: 200px" />
            </div>
            <br>
            <label for="cbHD"><input type="checkbox" id="cbHD">HD (very slow)</label>
            <br>
            <label>Sea level rise: <span id="lbSeaLevel">0 m</span><input type="range" id="sSeaLevel" min="0" max="100"
                    step="1" value="0" style="width:200px;"></label>
            <hr>
            <label for="cbLabels"><input type="checkbox" id="cbLabels" checked>City names</label>
            <br>
            <label for="cbPopulation"><input type="checkbox" id="cbPopulation" checked>Population dots</label>
            <br>
            <label for="cbBoundaries"><input type="checkbox" id="cbBoundaries" checked>Boundaries</label>
            <br>
            <label for="cbRoads"><input type="checkbox" id="cbRoads">Roads</label>
            <br>
            <label for="cbCLC"><input type="checkbox" id="cbCLC" checked>Inland waters</label>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gridviz@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridviz-parquet@1.2.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridviz-smoothing@3.0.3/dist/gridviz-smoothing.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-scale@4.0.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
    <script>




        //TODO
        // revamp GUI
        // check and use https://dominicroye.github.io/color-for-geoscience/
        // smartphone compatibility
        // finalise interpolator
        // test interpolateur for large scale - replace smoothing ?
        // better use smoothing - if necessary
        //slope-aspect styles
        /*
        //test https://d3js.org/d3-contour/density
        const smm2 = new gridviz.Style()
        smm2.drawFun = (cells, geoCanvas, resolution) => {
            //keep only cells with population
            //cells = cells.filter((c) => c.v);
            if (cells.length == 0) return;

            //index cells by y and x
            const ind = gridviz.cellsToGrid(cells, c => c.v)

            //horn slope
            //horn z1,z2,z3,z4,z5,z6,z7,z8,z9
            //if null, replicate nearest
            const r8 = 2 * resolution
            const slopeX = (z3 + 2 * z6 + z9 - z1 - 2 * z4 - z7) / r8
            const slopeY = (z7 + 2 * z8 + z9 - z1 - 2 * z2 - z3) / r8
        }*/

        //contour style based on d3 ? interpolated ?
        // no rayshade on sea margin ?
        //better structure styles
        //Check doc and examples: tanaka, lego, contours, raycast shading.
        //add some rivers ?




        const seaColor = "#a4c8e1"

        // prepare color ramps
        const interpolateRamp = (colors) =>
            d3.scaleLinear()
                .domain(d3.range(colors.length).map(i => i / (colors.length - 1)))
                .range(colors).interpolate(d3.interpolateLab); //interpolateLab interpolateRgb
        const ramps = {
            "Green - Yellow - Red": (t) => d3.interpolateRdYlGn(0.95 - t * 0.9),
            "Patterson-Jenny warm humid": interpolateRamp(["rgb(245,245,245)", "rgb(235,235,237)", "rgb(220,220,220)", "rgb(212,207,204)", "rgb(212,193,179)", "rgb(212,184,163)", "rgb(212,201,180)", "rgb(169,192,166)", "rgb(134,184,159)", "rgb(120,172,149)", "rgb(114,164,141)", "rgb(106,153,135)"].reverse()),
            "Bartholomew": interpolateRamp(["#bbcc9e", "#dde4c7", "#e0ebd9", "#e9f0d1", "#ece8c1", "#e9d6ad", "#e7c18c", "#e2b470", "#dda255", "#de8f4e", "#d57751", "#c8705e", "#d38487", "#dca3a4", "#edc7c2"]),
            "International map of the world": interpolateRamp(["#add7aa", "#d6e8b8", "#faf7c7", "#faf5be", "#fbcbb8", "#d9baca", "#f5e1e7"]),
            "Peuckers": interpolateRamp(["#a8bb9e", "#c9dcaa", "#f0f1af", "#fbf6b1", "#fde89f", "#f9a579", "#ea444b"]),
            "Green": (t) => d3.interpolateGreens(1 - t),
            "Gray": (t) => d3.interpolateGreys(0.8 - t * 0.8),
            "Viridis": d3.interpolateViridis,
            "Plasma": d3.interpolatePlasma,
            "Cubehelix": (t) => d3.interpolateCubehelixDefault(0.15 + 0.85 * t),
            "Rainbow": d3.interpolateRainbow,
            "None (white)": t => "white",
        }

        // build colour ramps combo list
        const hypscol = document.getElementById("hypscol");
        for (let r in ramps) hypscol.add(new Option(r, r));


        const map = new gridviz.Map(document.getElementById('map'), {
            x: 4200000, y: 2800000, z: 1800,
            backgroundColor: seaColor,
            //digForTooltip: true,
        })
            .setZoomExtent([5, 5000])
            .addZoomButtons()
            .setViewFromURL()

        const datasetRelief = new gridviz.MultiResolutionDataset(
            [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000],
            resolution => new gviz_par.TiledParquetGrid(map,
                "https://raw.githubusercontent.com/jgaffuri/tiled-euroDEM/main/pub/v1/tiles_" + resolution + "/"),
            { preprocess: (c) => c.v != undefined && c.v != 0 }
        )

        const datasetPop = new gridviz.MultiResolutionDataset(
            [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000],
            resolution => new gviz_par.TiledParquetGrid(map,
                "https://raw.githubusercontent.com/jgaffuri/europop100m/main/pub/JRC_100m/" + resolution + "/"),
        )

        const datasetCLC = new gridviz.MultiResolutionDataset(
            [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000],
            (resolution) => new gviz_par.TiledParquetGrid(map,
                'https://raw.githubusercontent.com/eurostat/LCMap/main/pub/clc/v1/2018/' + resolution + '/'),
            { preprocess: (c) => c.code == 40 || c.code == 41 || c.code == 42 || c.code == 43 || c.code == 44 }
        )

        const styleCLCWater = new gridviz.SquareColorCategoryWebGLStyle({
            code: (cell) => "a",
            color: { 'a': seaColor },
        })

        const strokeWidthPix = 1
        const fillColor = "#fffc"
        const strokeColor = "#666"
        const radiusFactor = 1.4
        const scalePopulation = gridviz.logarithmicScale(-3)
        const bertinPointsStyle = new gridviz.Style({
            drawFun: (cells, cg, r) => {
                //keep only cells with population
                cells = cells.filter((c) => c.POP_2021);
                if (cells.length == 0) return;

                //sort cells by decreasing x and increasing y
                cells.sort((c1, c2) => (c2.y == c1.y ? c1.x - c2.x : c2.y - c1.y));

                const max = d3.max(cells, (c) => +c.POP_2021);
                if (!max) return;

                //set canvas color and line width
                const ctx = cg.offscreenCtx
                ctx.fillStyle = fillColor;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = strokeWidthPix * cg.view.z;

                //console.log('z=', cg.view.z);

                const z = cg.view.z;
                for (let c of cells) {
                    //get circle size
                    const sG = radiusFactor * r * scalePopulation(c.POP_2021 / max);
                    if (sG / z < 3) continue

                    //draw circle
                    ctx.beginPath();
                    ctx.arc(c.x + r / 2, c.y + r / 2, sG * 0.5, 0, 2 * Math.PI, false);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        })

        const labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('EUR', 20))
        const boundariesLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer({ col: "#cc6699", scale: "03M" }))
        const roadsLayer = new gridviz.BackgroundLayer({
            url: "https://raw.githubusercontent.com/jgaffuri/gridStatBaseMap/main/pub/road/",
            resolutions: Array.from({ length: 14 }, (_, i) => 114688 / Math.pow(2, i)),
            origin: [0, 6000000],
            nbPix: 512,
            //visible: (z) => z > 4, //&& z < 2100,
            pixelationCoefficient: 0.55,
            blendOperation: (z) => 'multiply',
        })

        const cellInfoHTMLPop = 'none' //(c) => `Population: ${c.POP_2021}`
        const cellInfoHTMLRelief = (c) => `Elevation: ${c.v}`

        let scaleShadingCoeff = -2
        let shadingDiamond = false
        let quantile = false

        const readControls = () => ({
            seaLevel: +document.getElementById('sSeaLevel').value,
            reliefStyle: document.querySelector('input[name="rdreliefstyle"]:checked').value,
            smoothing: +document.getElementById('sReliefSmoothing').value,
            hd: document.getElementById('cbHD').checked,
            adjustHypsometryToSea: document.getElementById('cbHypssea').checked,
            adjustHypsometryToView: document.getElementById('cbHypsDyn').checked,
            classNumber: +document.getElementById('sReliefNb').value,
            reliefExaggeration: +document.getElementById('sReliefExageration').value,
            colorRamp: document.getElementById('hypscol').value,
            tanaka: document.getElementById('cbTanaka').checked,
            hillshading: document.getElementById('cbHillshading').checked,
            joyplotExaggeration: +document.getElementById('sReliefExagerationJP').value,
            hillshadingRay: document.getElementById('cbHillshadingRay').checked,
            sunAzimuth: +document.getElementById('sunrayAzimuth').value,
            sunAltitude: +document.getElementById('sunrayAltitude').value,
            sunAlpha: +document.getElementById('sunrayAlpha').value,
            clc: document.getElementById('cbCLC').checked,
            roads: document.getElementById('cbRoads').checked,
            population: document.getElementById('cbPopulation').checked,
            boundaries: document.getElementById('cbBoundaries').checked,
            labels: document.getElementById('cbLabels').checked,
        })

        const updateControlVisibility = (settings) => {
            document.getElementById('lbSeaLevel').textContent = settings.seaLevel + ' m'
            document.getElementById('hyps_div').style.display =
                settings.reliefStyle === 'hyps' ? 'inline-block' : 'none'
            document.getElementById('joyplot_div').style.display =
                settings.reliefStyle === 'joyplot' ? 'inline-block' : 'none'
            document.getElementById('rc_div').style.display =
                settings.hillshadingRay ? 'inline-block' : 'none'
            document.getElementById('refexhyps').style.display =
                settings.adjustHypsometryToView ? 'inline-block' : 'none'
        }

        const withReliefSmoothing = (styles, settings) => {
            if (settings.smoothing <= 0) return styles
            return [
                new gridviz_smoothing.KernelSmoothingStyle({
                    value: (cell) => +cell.v,
                    smoothedProperty: 'v',
                    sigma: (resolution) => (settings.smoothing * resolution) / 2,
                    resolutionSmoothed:
                        settings.hd && settings.reliefStyle === 'hyps'
                            ? (resolution, zoom) => Math.ceil(zoom)
                            : (resolution) => resolution,
                    filterSmoothed: Number.isFinite,
                    styles,
                }),
            ]
        }

        const createHypsometricClassifier = (settings) => {
            if (!settings.adjustHypsometryToView) {
                const min = settings.adjustHypsometryToSea && settings.seaLevel ? settings.seaLevel : 0
                const breaks = Array.from(
                    { length: settings.classNumber - 1 },
                    (_, i) => min + (3000 - min) * (i + 1) / (settings.classNumber - 1)
                )
                const classifier = gridviz.classifier(breaks)
                return () => classifier
            }
            if (quantile)
                return (cells) => gridviz.viewScaleQuantileClassifer({
                    valueFunction: (cell) => cell.v,
                    classNumber: settings.classNumber,
                })(cells)

            const stretching = gridviz.logarithmicScale(3 + 0.3 * settings.reliefExaggeration)
            return (cells) => {
                const [min, max] = d3.extent(cells, (cell) => cell.v)
                const minValue = settings.adjustHypsometryToSea
                    ? Math.max(min, settings.seaLevel)
                    : min < 0 ? 0 : min
                const breaks = Array.from({ length: settings.classNumber - 1 }, (_, i) => {
                    const t = stretching((i + 1) / settings.classNumber)
                    return minValue + (max - minValue) * t
                })
                return gridviz.classifier(breaks)
            }
        }

        const createHypsometricStyles = (settings) => {
            const colors = Array.from({ length: settings.classNumber }, (_, i) =>
                ramps[settings.colorRamp](i / (settings.classNumber - 1))
            )
            const classifier = createHypsometricClassifier(settings)
            const styles = []

            if (settings.adjustHypsometryToView) {
                const hypsoStyle = new gridviz.SquareColorCategoryWebGLStyle({
                    viewScale: classifier,
                    code: (cell, resolution, zoom, cellClassifier) => cellClassifier(cell.v),
                    color: { ...colors },
                })
                hypsoStyle.legends = [
                    new gridviz.ColorDiscreteLegend({
                        title: 'Elevation, in meters',
                        colors: () => colors,
                        breaks: (viewScale) => viewScale?.breaks.map((value) => Math.round(value)),
                        width: Math.min(window.innerWidth - 40, 400),
                    }),
                ]
                styles.push(hypsoStyle)
            } else {
                const classify = classifier()
                styles.push(
                    new gridviz.SquareColorCategoryWebGLStyle({
                        code: (cell) => classify(cell.v),
                        color: { ...colors },
                    })
                )
            }

            if (settings.tanaka) {
                styles.push(
                    new gridviz.SideTanakaStyle({
                        classifier: (cells) => {
                            const classify = classifier(cells)
                            return (cell) => classify(cell.v)
                        },
                        diamond: shadingDiamond,
                    })
                )
            }
            return styles
        }

        const createReliefLayer = (settings, minimumPixelsPerCell) => {
            const styles = settings.reliefStyle === 'hyps'
                ? createHypsometricStyles(settings)
                : [
                    new gridviz.SquareColorCategoryWebGLStyle({
                        code: () => 'a',
                        color: { a: 'white' },
                        filter: (cell) => cell.v >= 0,
                    }),
                    new gridviz.JoyPlotStyle({
                        viewScale: (cells) => d3.extent(cells, (cell) => cell.v),
                        height: (cell, resolution, zoom, [min, max]) =>
                            settings.joyplotExaggeration * resolution * cell.v / max,
                        lineColor: () => '#b58500',
                        lineWidth: (y, ys, resolution, zoom) => zoom / 1.5,
                        fillColor: () => 'white',
                    }),
                ]
            if (settings.reliefStyle === 'hyps' && settings.hillshading) {
                styles.push(
                    new gridviz.ShadingStyle({
                        elevation: 'v',
                        scale: gridviz.exponentialScale(scaleShadingCoeff),
                        diamond: shadingDiamond,
                    })
                )
            }
            return new gridviz.GridLayer(datasetRelief, withReliefSmoothing(styles, settings), {
                minPixelsPerCell: minimumPixelsPerCell *
                    (settings.reliefStyle === 'joyplot' ? 2 : 1),
                cellInfoHTML: cellInfoHTMLRelief,
            })
        }

        const createOverlayLayers = (settings, minimumPixelsPerCell) => {
            const layers = []
            if (settings.clc)
                layers.push(new gridviz.GridLayer(datasetCLC, [styleCLCWater], {
                    minPixelsPerCell: minimumPixelsPerCell,
                    cellInfoHTML: 'none',
                }))
            if (settings.roads) layers.push(roadsLayer)
            if (settings.population)
                layers.push(new gridviz.GridLayer(datasetPop, [bertinPointsStyle], {
                    minPixelsPerCell: 4,
                    cellInfoHTML: cellInfoHTMLPop,
                }))
            if (settings.boundaries) layers.push(boundariesLayer)
            if (settings.seaLevel) {
                const styleWater = new gridviz.SquareColorCategoryWebGLStyle({
                    code: () => 'a',
                    color: { a: seaColor },
                    filter: (cell) => cell.v <= settings.seaLevel,
                    alpha: () => 0.85,
                })
                layers.push(new gridviz.GridLayer(
                    datasetRelief,
                    withReliefSmoothing([styleWater], settings),
                    { minPixelsPerCell: minimumPixelsPerCell, cellInfoHTML: 'none' }
                ))
            }
            if (settings.hillshadingRay) {
                const rayStyle = new gridviz.ShadingRayStyle({
                    elevation: (cell) => cell.v,
                    alpha: () => settings.sunAlpha,
                    sunAltitude: () => settings.sunAltitude,
                    sunAzimuth: () => settings.sunAzimuth,
                })
                layers.push(new gridviz.GridLayer(
                    datasetRelief,
                    withReliefSmoothing([rayStyle], settings),
                    { minPixelsPerCell: minimumPixelsPerCell, cellInfoHTML: 'none' }
                ))
            }
            if (settings.labels) layers.push(labelLayer)
            return layers
        }

        const update = () => {
            const settings = readControls()
            updateControlVisibility(settings)
            const minimumPixelsPerCell = settings.hd ? 0.7 : 1.5
            map.layers = [
                createReliefLayer(settings, minimumPixelsPerCell),
                ...createOverlayLayers(settings, minimumPixelsPerCell),
            ]
            map.redraw()
        }

        //add form event listener
        document.getElementById("form").addEventListener('input', update);

        //keyboard events
        window.addEventListener('keypress', e => {
            if (e.key == "h") {
                const div = document.getElementById("control");
                if (div.style.display === "none") div.style.display = "block"; // or "inline", "flex", etc.
                else div.style.display = "none";
            }
            else if (e.key == "q") { quantile = !quantile; update() }
            else if (e.key == "d") { shadingDiamond = !shadingDiamond; update() }
            else if (e.key == "w") { scaleShadingCoeff -= 0.25; console.log(scaleShadingCoeff); update() }
            else if (e.key == "x") { scaleShadingCoeff += 0.25; console.log(scaleShadingCoeff); update() }
        })

        update()

    </script>

</body>

</html>
