<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="maximum-scale=1.0, user-scalable=no" />
        <title></title>
    </head>

    <body style="margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; overflow: hidden">
        <div id="viz-container" style="height: 100%; width: 100%"></div>

        <div
            style="
                position: absolute;
                left: 20px;
                top: 20px;
                width: auto;
                height: auto;
                padding: 10px;
                border: 0px;
                border-radius: 5px;
                background: #ffffffcc;
                line-height: 1.6;
                box-shadow: 5px 5px 5px grey;
            "
        >
            <div id="layer">
                <span style="font-size: 1.5em; font-weight: bold">Population</span>
                <br />
                <span style="font-size: 1.2em">
                    <input type="radio" name="layer" id="pop" value="pop" checked />
                    <label for="pop">Total population</label>
                    <br />
                    <input type="radio" name="layer" id="popSex" value="popSex" />
                    <label for="popSex">By sex</label>
                    <br />
                    <input type="radio" name="layer" id="popMarital" value="popMarital" />
                    <label for="popMarital">By marital status</label>
                    <br />
                    <input type="radio" name="layer" id="popAge" value="popAge" />
                    <label for="popAge">By age</label>
                    <input type="radio" name="layer" id="ageR" value="ageR" />
                    <label for="ageR">Age balance</label>
                    <br />
                    <input type="radio" name="layer" id="popCoB" value="popCoB" />
                    <label for="popCoB">By birth place</label>
                    <input type="radio" name="layer" id="popCit" value="popCit" />
                    <label for="popCit">or citizenship</label> (<input
                        type="checkbox"
                        id="popCoBCitCB"
                        checked
                    />
                    <label for="popCoBCitCB">size by population</label>)
                    <br />
                    <input type="radio" name="layer" id="popRelig" value="popRelig" />
                    <label for="popRelig">By religion</label> (<input type="checkbox" id="popReligCB" />
                    <label for="popReligCB">size by population</label>)
                    <br />
                    <input type="radio" name="layer" id="popS" value="popS" />
                    <label for="popS">Smoothed</label>
                    <input type="range" min="3" max="30" value="10" class="slider" id="sigma" />
                    <br />
                </span>
                <span style="font-size: 1.5em; font-weight: bold">Habitation</span>
                <br />
                <span style="font-size: 1.2em">
                    <input type="radio" name="layer" id="habType" value="habType" />
                    <label for="habType">Building type</label>
                    <br />
                    <input type="radio" name="layer" id="habYear" value="habYear" />
                    <label for="habYear">Construction date</label>
                    <br />
                    <input type="radio" name="layer" id="habHeat" value="habHeat" />
                    <label for="habHeat">Heating system</label>
                </span>
            </div>
            <span style="font-size: 1.2em">
                <hr />
                <input type="checkbox" id="label" checked />
                <label for="label">City names</label>
                <input type="checkbox" id="boundary" checked />
                <label for="boundary">Boundaries</label>
                <input type="checkbox" id="background" checked />
                <label for="background">Background</label>
                <hr />
                Source:
                <a
                    href="https://www.zensus2011.de/DE/Home/Aktuelles/DemografischeGrunddaten.html?nn=559100#Gitter"
                    style="text-decoration: none"
                    >Statistisches Bundesamt, Wiesbaden 2018</a
                >
            </span>
        </div>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.2.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-smoothing@3.0.3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-format@3"></script>
        <script>
            //define map with initial view
            const map = new gridviz.Map(document.getElementById('viz-container'), {
                x: 4301000,
                y: 3050000,
                z: 400,
            }).addZoomButtons()

            //labels and boundaries
            const labelLayer = new gridviz.LabelLayer(gridviz_eurostat.getEuronymeLabelLayer('DE', '20'))
            const boundaryLayer = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())

            //background layers: a WMS map when zoomed in, and the elevation shading when zoomed out
            const backgroundLayers = [
                new gridviz.BackgroundLayerWMS({
                    url: 'https://sgx.geodatenzentrum.de/wms_basemapde?&service=WMS&request=GetMap&layers=de_basemapde_web_raster_grau&styles=&format=image%2Fjpeg&transparent=false&version=1.1.1&srs=EPSG%3A3035',
                    visible: (z) => z < 50,
                }),
                new gridviz.BackgroundLayer({
                    url: 'https://raw.githubusercontent.com/jgaffuri/mbxyz/main/pub/elevation_shading/',
                    resolutions: Array.from({ length: 9 }, (_, i) => 28.00132289714475 * Math.pow(2, 10 - i)),
                    origin: [0, 6000000],
                    filterColor: () => '#ffffff60',
                    visible: (z) => z >= 50,
                }),
            ]

            //prepare datasets, indexed by thematic domain and year
            const ds = {}

            //the values of the cells are text
            const cleanCell = (c) => {
                for (let k of Object.keys(c)) c[k] = +c[k]
            }

            const baseURLCSV = 'https://raw.githubusercontent.com/jgaffuri/tiled-grid-germany-zensus2011/main/out/'
            const makeDataset = (code, preprocess) =>
                new gridviz.MultiResolutionDataset(
                    [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000],
                    (r) => new gridviz.TiledGrid(map, baseURLCSV + code + 'csv/' + r + 'm/'),
                    { preprocess: preprocess }
                )

            //total population
            ds.INSGESAMT = makeDataset('INSGESAMT', (c) => {
                cleanCell(c)
            })

            //sex
            ds.GESCHLECHT = makeDataset('GESCHLECHT', (c) => {
                cleanCell(c)
                c.TOT = c['1'] + c['2']
                c.I = c['1'] - c['2']
                c.I = (100 * c.I) / c.TOT
                if (isNaN(c.I)) c.I = 0
            })

            //marital status
            ds.FAMSTND_AUSF = makeDataset('FAMSTND_AUSF', (c) => {
                cleanCell(c)
                c.TOT = 0
                for (let i = 1; i <= 8; i++) c.TOT += c[i]
                c.S = c['1']
                c.M = c['2'] + c['5']
                c.D = c['4'] + c['7']
                c.W = c['3'] + c['6']
                c.ND = c['8']
            })

            //age
            ds.ALTER_KURZ = makeDataset('ALTER_KURZ', (c) => {
                cleanCell(c)
                c.TOT = 0
                for (let i = 1; i <= 5; i++) c.TOT += c[i]
                //age ratio
                //<29
                c.yyy = +c['1'] + c['2']
                //>50
                c.ooo = +c['4'] + c['5']
                c.age_ratio = c.yyy + c.ooo == 0 ? 0 : (c.yyy - c.ooo) / (c.yyy + c.ooo)
                c.age_ratio = c.age_ratio * 0.5 + 0.5
            })

            //place of birth
            ds.GEBURTLAND_GRP = makeDataset('GEBURTLAND_GRP', (c) => {
                cleanCell(c)
                c.TOT = c['1'] + c['21'] + c['22'] + c['23'] + c['24']
            })

            //citizenship
            ds.STAATSANGE_GRP = makeDataset('STAATSANGE_GRP', (c) => {
                cleanCell(c)
                c.TOT = c['1'] + c['21'] + c['22'] + c['23'] + c['24']
            })

            //religion
            ds.RELIGION_KURZ = makeDataset('RELIGION_KURZ', (c) => {
                cleanCell(c)
                c.TOT = c['1'] + c['2'] + c['3']
            })

            //building type
            ds.GEBTYPBAUWEISE = makeDataset('GEBTYPBAUWEISE', (c) => {
                cleanCell(c)
                c.TOT = 0
                for (let i = 1; i <= 4; i++) c.TOT += c[i]
            })

            //building age
            ds.BAUJAHR_MZ = makeDataset('BAUJAHR_MZ', (c) => {
                cleanCell(c)
                c.TOT = 0
                for (let i = 1; i <= 10; i++) c.TOT += c[i]
            })

            //heating system
            ds.HEIZTYP = makeDataset('HEIZTYP', (c) => {
                cleanCell(c)
                c.TOT = 0
                for (let i = 1; i <= 6; i++) c.TOT += c[i]

                c.fernw = c['1']
                c.etagen = c['2']
                c.zentral = c['4']
                c.sonst = c['3'] + c['5'] + c['6']
                for (let i = 1; i <= 6; i++) delete c[i]
            })

            // ---------- helpers to make the styles ----------

            //the size of the symbols of a column: stretched, and in proportion of the maximum of the view
            const sizeViewScale = (column, factor, stretching) => (cells, resolution) => {
                const max = d3.max(cells, (c) => +c[column])
                return { size: (v) => factor * resolution * stretching(v / max), max: max }
            }

            //the legend of the size of the symbols
            const sizeLegends = (shape, unit, fillColor = '#ccc') =>
                [0.9, 0.2, 0.05].map(
                    (k) =>
                        new gridviz.SizeLegend({
                            shape: shape,
                            labelUnitText: unit,
                            fillColor: fillColor,
                            label: (vs) => gridviz.nice(k * vs.max),
                            size: (vs) => vs.size(gridviz.nice(k * vs.max)),
                        })
                )
            //a composition style: pie charts, flags...: the size of the symbols is the total of the cell
            const compositionStyle = (colors, type, factor, stretching, opts = {}) =>
                new gridviz.CompositionStyle({
                    color: colors,
                    type: () => type,
                    viewScale: sizeViewScale('TOT', factor, gridviz.powerScale(stretching)),
                    size: (c, r, z, vs) => vs.size(+c.TOT),
                    ...opts,
                })

            const multiply = (z) => (z < 4 ? 'multiply' : 'source-over')

            //
            const update = () => {
                //read GUI selection
                const layCode = document.querySelector('input[name="layer"]:checked').value

                let dataset, styles, options
                if (layCode === 'pop') {
                    //population
                    const stretching = gridviz.logarithmicScale(-7)
                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => d3.max(cells, (c) => +c['0']),
                        tFun: (c, r, z, max) => c['0'] / max,
                        color: d3.interpolateYlOrRd,
                        stretching: { fun: 'log', alpha: -7 },
                        blendOperation: (z) => (z < 10 ? 'multiply' : 'source-over'),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Population',
                            colorScale: d3.interpolateYlOrRd,
                            textScale: (t, max) => Math.round(max * stretching.invert(t)),
                            ticks: 5,
                        }),
                    ]
                    dataset = ds.INSGESAMT
                    styles = [style, new gridviz.StrokeStyle({ visible: (z) => z < 7 })]
                    options = {
                        minPixelsPerCell: 1.5,
                        cellInfoHTML: (c) => '<b>' + c['0'] + '</b> person' + (+c['0'] == 1 ? '' : 's'),
                    }
                } else if (layCode === 'popS') {
                    //smoothed population
                    const sig = document.querySelector('#sigma').value
                    const colR = d3.interpolateYlOrRd
                    const nb = 5
                    const stretching = gridviz.logarithmicScale(-10)

                    const style = new gridviz.SquareColorWebGLStyle({
                        viewScale: (cells) => d3.max(cells, (c) => +c.ksmval),
                        tFun: (c, r, z, max) => Math.floor(nb * stretching(c.ksmval / max)) / nb,
                        color: colR,
                        blendOperation: (z) => (z < 50 ? 'multiply' : 'source-over'),
                    })
                    style.legends = [
                        new gridviz.ColorLegend({
                            title: 'Population',
                            colorScale: (t) => colR(Math.floor(t * nb) / nb),
                            width: 200,
                            ticks: 2,
                            textScale: (t) => (t == 0 ? 'Low' : t == 1 ? 'High' : 'X'),
                        }),
                    ]
                    dataset = ds.INSGESAMT
                    styles = [
                        new gridviz_smoothing.KernelSmoothingStyle({
                            value: (c) => +c['0'],
                            filterSmoothed: (v) => v > 0.001,
                            sigma: (r, z) => (r * +sig) / 10,
                            factor: 2,
                            styles: [style],
                        }),
                    ]
                    options = {
                        minPixelsPerCell: 1.5,
                        cellInfoHTML: (c) => '<b>' + c['0'] + '</b> person' + (+c['0'] == 1 ? '' : 's'),
                    }
                } else if (layCode === 'popSex') {
                    const fs = d3.format('.1f')
                    const p02 = gridviz.powerScale(0.2)
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: (cells, resolution) => ({
                            ...sizeViewScale('TOT', 1.3, p02)(cells, resolution),
                            maxDiff: d3.max(cells, (c) => Math.abs(c.I)),
                        }),
                        color: (c, r, z, vs) => {
                            const t = (Math.sign(c.I) * p02(Math.abs(c.I) / vs.maxDiff)) / 2 + 0.5
                            return d3.interpolateSpectral(1 - t)
                        },
                        shape: () => 'circle',
                        size: (c, r, z, vs) => vs.size(+c.TOT),
                        blendOperation: multiply,
                    })
                    style.legends = [
                        ...sizeLegends('circle', 'inhab.'),
                        new gridviz.ColorLegend({
                            title: 'Men / women difference',
                            ticks: 3,
                            textScale: (t) => (t == 0 ? 'More women' : t == 0.5 ? 'Balanced' : 'More men'),
                            colorScale: d3.interpolateSpectral,
                            invert: true,
                        }),
                    ]
                    dataset = ds.GESCHLECHT
                    styles = [style]
                    options = {
                        minPixelsPerCell: 8,
                        cellInfoHTML: (c) =>
                            c['1'] +
                            ' men<br>' +
                            c['2'] +
                            ' women<br>Difference: <b>' +
                            (c.I > 0 ? '+' : '') +
                            fs(c.I) +
                            ' % men</b>',
                    }
                } else if (layCode === 'popMarital') {
                    //population by marital status
                    /*
                    FAMSTND_AUSF
                    S 1 Single
                    M 2 Married 5 Party to a civil union
                    D 4 Divorced (including annulled marriages) 7 Civil union annulled
                    W 3 Widowed 6 Civil partner deceased (including “civil union dissolved by death” and “civil union dissolved by declaration of death”)
                    ND 8 No data
                    */
                    const style = compositionStyle(
                        {
                            S: '#33a02c', //green
                            M: '#ff7f00', //orange
                            D: '#1f78b4', //blue,
                            W: '#6a3d9a', //purple
                            ND: '#ddd', //gray
                        },
                        'segment',
                        1,
                        0.25,
                        { stripesOrientation: () => 90, blendOperation: (z) => (z < 6 ? 'multiply' : 'source-over') }
                    )
                    style.legends = [
                        ...sizeLegends('square', 'people'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Marital status',
                            shape: 'square',
                            colorLabel: [
                                ['#33a02c', 'Single'],
                                ['#ff7f00', 'Married / civil union'],
                                ['#1f78b4', 'Divorced / annulled'],
                                ['#6a3d9a', 'Widowed / partner deceased'],
                                ['#ddd', 'No data'],
                            ],
                        }),
                    ]
                    dataset = ds.FAMSTND_AUSF
                    styles = [style]
                    options = {
                        minPixelsPerCell: 12,
                        cellInfoHTML: (c) =>
                            'Single: ' +
                            c.S +
                            '<br>Married / civil union: ' +
                            c.M +
                            '<br>Divorced / annulled: ' +
                            c.D +
                            '<br>Widowed / partner deceased: ' +
                            c.W +
                            '<br>No data: ' +
                            c.ND,
                    }
                } else if (layCode === 'popAge') {
                    /*population by age (5 age groups)  ALTER_KURZ   1 Under 18     2 18 - 29    3 30 - 49    4 50 - 64   5 65 and over */
                    const style = compositionStyle(
                        {
                            1: '#984ea3',
                            2: '#377eb8',
                            3: '#ffff33',
                            4: '#ff7f00',
                            5: '#e41a1c',
                        },
                        'flag',
                        1,
                        0.25,
                        { stripesOrientation: () => 90, blendOperation: multiply }
                    )
                    style.legends = [
                        ...sizeLegends('square', 'people'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Age',
                            shape: 'square',
                            colorLabel: [
                                ['#984ea3', '< 18'],
                                ['#377eb8', '18-29'],
                                ['#ffff33', '30-49'],
                                ['#ff7f00', '50-64'],
                                ['#e41a1c', ' > 64'],
                            ].reverse(),
                        }),
                    ]
                    dataset = ds.ALTER_KURZ
                    styles = [style]
                    options = {
                        minPixelsPerCell: 15,
                        cellInfoHTML: (c) =>
                            ' < 18 : ' +
                            c['1'] +
                            '<br> 18-29 : ' +
                            c['2'] +
                            '<br> 30-49 : ' +
                            c['3'] +
                            '<br> 50-64 : ' +
                            c['4'] +
                            '<br> > 64: ' +
                            c['5'],
                    }
                } else if (layCode === 'ageR') {
                    //young VS elderly
                    const style = new gridviz.ShapeColorSizeStyle({
                        viewScale: sizeViewScale('TOT', 1.4, gridviz.powerScale(0.2)),
                        size: (c, r, z, vs) => vs.size(+c.TOT),
                        color: (c) => d3.interpolateSpectral(1 - c.age_ratio),
                        shape: () => 'circle',
                        blendOperation: multiply,
                    })
                    style.legends = [
                        ...sizeLegends('circle', 'people'),
                        new gridviz.ColorLegend({
                            title: 'Balance young / old',
                            ticks: 2,
                            textScale: (t) => (t == 0 ? 'Younger' : t == 0.5 ? 'Balanced' : 'Elder'),
                            colorScale: d3.interpolateSpectral,
                        }),
                    ]
                    dataset = ds.ALTER_KURZ
                    styles = [style]
                    options = {
                        minPixelsPerCell: 7,
                        cellInfoHTML: (c) =>
                            '<b>' +
                            c.yyy +
                            '</b> person(s) aged 29 or younger<br><b>' +
                            c.ooo +
                            '</b> person(s) aged 50 or elder',
                    }
                } else if (layCode === 'popCoB' || layCode === 'popCit') {
                    //population by country of birth, or by citizenship
                    //1 Germany
                    //21 EU27
                    //22 Rest of Europe
                    //23 Rest of the world
                    //24 Other
                    const sized = document.querySelector('#popCoBCitCB').checked
                    const style = compositionStyle(
                        {
                            1: '#fed9a6', //light mostard
                            21: '#7570b3', //blueish
                            22: '#1b9e77', //greenish,
                            23: '#d95f02', //orange
                            24: '#ddd', //gray
                        },
                        sized ? 'halftone' : 'flag',
                        1.3,
                        0.25,
                        sized
                            ? {}
                            : { size: undefined, viewScale: undefined, stripesOrientation: () => 90, blendOperation: (z) => (z < 6 ? 'multiply' : 'source-over') }
                    )
                    style.legends = [
                        ...(sized ? sizeLegends('circle', 'people') : []),
                        new gridviz.ColorCategoryLegend({
                            title: layCode === 'popCoB' ? 'Birth place' : 'Citizenship',
                            shape: sized ? 'circle' : 'square',
                            colorLabel: [
                                ['#fed9a6', 'Germany'],
                                ['#7570b3', 'European union'],
                                ['#1b9e77', 'Rest of Europe'],
                                ['#d95f02', 'Rest of the world'],
                                ['#ddd', 'Other'],
                            ],
                        }),
                    ]
                    dataset = layCode === 'popCoB' ? ds.GEBURTLAND_GRP : ds.STAATSANGE_GRP
                    styles = [style]
                    options = {
                        minPixelsPerCell: sized ? 22 : 5,
                        cellInfoHTML: (c) =>
                            'Germany: ' +
                            c['1'] +
                            '<br>European union: ' +
                            c['21'] +
                            '<br>Rest of Europe: ' +
                            c['22'] +
                            '<br>Rest of the world: ' +
                            c['23'] +
                            '<br>Other: ' +
                            c['24'],
                    }
                } else if (layCode === 'popRelig') {
                    const sized = document.querySelector('#popReligCB').checked
                    const style = compositionStyle(
                        {
                            1: '#7570b3', //blueish
                            2: '#1b9e77', //greenish,
                            3: '#e6ab02', //light mostard
                        },
                        'segment',
                        1,
                        0.25,
                        {
                            stripesOrientation: () => 90,
                            blendOperation: multiply,
                            ...(sized ? {} : { size: undefined, viewScale: undefined }),
                        }
                    )
                    style.legends = [
                        ...(sized ? sizeLegends('square', 'people') : []),
                        new gridviz.ColorCategoryLegend({
                            title: 'Religion',
                            shape: 'square',
                            colorLabel: [
                                ['#7570b3', 'Roman catholic church'],
                                ['#1b9e77', 'Protestant church'],
                                ['#e6ab02', 'Other, none, no data'],
                            ],
                        }),
                    ]
                    dataset = ds.RELIGION_KURZ
                    styles = [style]
                    options = {
                        minPixelsPerCell: sized ? 10 : 4,
                        cellInfoHTML: (c) =>
                            'Roman catholic church: ' +
                            c['1'] +
                            '<br>Protestant church: ' +
                            c['2'] +
                            '<br>Other, none, no data: ' +
                            c['3'],
                    }
                } else if (layCode === 'habType') {
                    /* GEBTYPBAUWEISE			Gebäudetyp-Bauweise
                    1	 Freistehendes Haus
                    2	 Doppelhaus hälfte
                    3	 Gereihtes Haus
                    4	 Anderer Gebäudetyp */
                    const style = compositionStyle(
                        {
                            1: '#33a02c', //green Detached house
                            2: '#1f78b4', //blue Semi-detached houses
                            3: '#6a3d9a', //purple Terraced house
                            4: '#ff7f00', //orange Other type
                        },
                        'flag',
                        1,
                        0.25,
                        { stripesOrientation: () => 90, blendOperation: multiply }
                    )
                    style.legends = [
                        ...sizeLegends('square', 'habitations'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Building type',
                            colorLabel: [
                                ['#33a02c', 'Detached house'],
                                ['#1f78b4', 'Semi-detached houses'],
                                ['#6a3d9a', 'Terraced house'],
                                ['#ff7f00', 'Other type'],
                            ],
                        }),
                    ]
                    dataset = ds.GEBTYPBAUWEISE
                    styles = [style]
                    options = {
                        minPixelsPerCell: 12,
                        cellInfoHTML: (c) =>
                            'Detached house: ' +
                            c['1'] +
                            '<br>Semi-detached houses: ' +
                            c['2'] +
                            '<br>Terraced house: ' +
                            c['3'] +
                            '<br>Other type: ' +
                            c['4'],
                    }
                } else if (layCode === 'habYear') {
                    /*   BAUJAHR_MZ			Baujahr (Mikrozensus-Klassen)
                    1	 "before 1919"
                    2	 "1919 - 1948"
                    3	 "1949 - 1978"
                    4	 "1979 - 1986"
                    5	 "1987 - 1990"
                    6	 "1991 - 1995"
                    7	 "1996 - 2000"
                    8	 "2001 - 2004"
                    9	 "2005 - 2008"
                    10	 "2009 und later"  */
                    const labels = [
                        'before 1919',
                        '1919 - 1948',
                        '1949 - 1978',
                        '1979 - 1986',
                        '1987 - 1990',
                        '1991 - 1995',
                        '1996 - 2000',
                        '2001 - 2004',
                        '2005 - 2008',
                        '2009 and later',
                    ]

                    const col = d3.interpolateViridis
                    const colsDict = {}
                    for (let i = 1; i <= 10; i++) colsDict['' + i] = col((i - 1) / 9)

                    const style = compositionStyle(colsDict, 'flag', 1, 0.25, {
                        stripesOrientation: () => 90,
                        blendOperation: multiply,
                    })
                    const colCats = []
                    for (let i = 1; i <= 10; i++) colCats.push([col((i - 1) / 9), labels[i - 1]])
                    style.legends = [
                        ...sizeLegends('square', 'habitations'),
                        new gridviz.ColorCategoryLegend({ title: 'Construction date', shape: 'square', colorLabel: colCats }),
                    ]
                    dataset = ds.BAUJAHR_MZ
                    styles = [style]
                    options = {
                        minPixelsPerCell: 12,
                        cellInfoHTML: (c) => {
                            const sb = []
                            for (let i = 1; i <= 10; i++) sb.push('<br>' + labels[i - 1] + ': ' + c['' + i])
                            return sb.join('')
                        },
                    }
                } else if (layCode === 'habHeat') {
                    /* HEIZTYP
                    1	 Fernheizung (Fernwärme)   Chauffage urbain (chauffage urbain)
                    2	 Etagenheizung			  chauffage au sol
                    3	 Blockheizung			  chauffe-bloc
                    4	 Zentralheizung			  chauffage central
                    5	 Einzel-/Mehrraumöfen (auch Nachtspeicherheizung)
                    6	 Keine Heizung im Gebäude oder in den Wohnungen */
                    const style = compositionStyle(
                        {
                            fernw: '#1f78b4',
                            sonst: 'rgb(180, 180, 180)',
                            etagen: 'rgb(255, 164, 52)',
                            zentral: '#33a02c',
                        },
                        'piechart',
                        1.2,
                        0.25,
                        { blendOperation: multiply }
                    )
                    style.legends = [
                        ...sizeLegends('circle', 'habitations'),
                        new gridviz.ColorCategoryLegend({
                            title: 'Heating system',
                            colorLabel: [
                                ['#33a02c', 'Central heating'], //zentral
                                ['rgb(255, 164, 52)', 'Floor heating'], //etagen
                                ['#1f78b4', 'District heating'], //fernw
                                ['rgb(180, 180, 180)', 'Other'],
                            ],
                        }),
                    ]
                    dataset = ds.HEIZTYP
                    styles = [style]
                    options = {
                        minPixelsPerCell: 12,
                        cellInfoHTML: (c) =>
                            'Central heating: ' +
                            c.zentral +
                            '<br>Floor heating: ' +
                            c.etagen +
                            '<br>District heating: ' +
                            c.fernw +
                            '<br>Other: ' +
                            c.sonst,
                    }
                } else {
                    console.error('Unexpected layer code: ' + layCode)
                    return
                }

                //the layers: the backgrounds, the data, then the boundaries and the labels
                map.layers = []
                if (document.querySelector('#background').checked) map.layers.push(...backgroundLayers)
                map.layers.push(new gridviz.GridLayer(dataset, styles, options))
                if (document.querySelector('#boundary').checked) map.layers.push(boundaryLayer)
                if (document.querySelector('#label').checked) map.layers.push(labelLayer)

                //redraw
                map.redraw()
            }

            document.querySelector('#layer').addEventListener('change', update)
            document.getElementById('sigma').oninput = update

            // show/hide labels, boundaries and backgrounds
            document.querySelector('#label').addEventListener('change', update)
            document.querySelector('#boundary').addEventListener('change', update)
            document.querySelector('#background').addEventListener('change', update)

            //select layer from URL
            const ls = gridviz.getParameterByName('lay')
            if (ls) {
                const b = document.querySelector('#' + ls)
                if (b) b.checked = true
            }

            update()
        </script>

        <div
            style="
                position: absolute;
                right: 0px;
                bottom: 0px;
                width: auto;
                height: auto;
                padding: 1px;
                border: 0px;
                background: #ffffffcc;
            "
        >

                    >EuroGeographics</a
                ></span
