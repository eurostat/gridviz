<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gridviz multivariate map: forest types, with a Venn diagram legend (issue #146)</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                font-family: Helvetica, Arial, sans-serif;
            }
            #panel {
                position: absolute;
                top: 15px;
                left: 15px;
                pointer-events: none;
                font-size: 13px;
                color: #444;
                background: #fffe;
                padding: 14px 16px 10px;
                border-radius: 6px;
                box-shadow: 0 1px 6px #0003;
            }
            #title {
                padding-bottom: 10px;
                margin-bottom: 10px;
                border-bottom: 1px solid #ddd;
            }
            #title h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 700;
                line-height: 1.15;
                letter-spacing: -0.01em;
                color: #222;
            }
            #title p {
                margin: 4px 0 0;
                font-size: 13px;
                color: #666;
            }
            #panel .label {
                font-size: 12px;
                font-weight: 600;
                color: #333;
                margin: 2px 0 2px;
            }
            #legends {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                gap: 14px;
                min-height: 34px;
                margin-bottom: 6px;
            }
            #legends .gridviz-legend--venn {
                flex-basis: 100%;
            }
            /* the panel lets the mouse through to the map, but the legends are interactive: hovering them shows only the matching cells */
            #legends {
                pointer-events: auto;
            }
            #source {
                position: absolute;
                bottom: 8px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 12px;
                color: #444;
                background: #fffc;
                padding: 2px 6px;
            }
        </style>
    </head>
    <body>
        <div id="map" style="height: 100%; width: 100%"></div>
        <div id="panel">
            <div id="title">
                <h1>Forest types in Europe</h1>
                <p>Broad-leaved, coniferous and mixed forest</p>
            </div>
            <div class="label">Circle area: area of the forest type (km²)</div>
            <div id="legends"></div>
        </div>
        <div id="source">Data: CORINE Land Cover 2018, aggregated from 1 km cells | Background: Eurostat/GISCO</div>

        <script src="../../../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.0.2"></script>
        <script>
            // Multivariate map: what kind of forest is there?
            // Nested circles in each cell: one per forest type, with an area proportional to the area of the forest type in the cell.
            // The circles are blended by multiplication, so their overlaps have the colours of a Venn diagram.
            // The map is multi-resolution: the areas were summed from 1 km CORINE cells into bigger cells (see prepare.html).

            //the resolutions of the map, in m. One CSV file per resolution, in this folder.
            const RESOLUTIONS = [5000, 10000, 20000, 50000]
            //the opacity of the circles
            const OPACITY = 0.85
            //the circle diameter (in m) per square root of the forest area (in km2). The circle area is then proportional to the forest area, at all resolutions.
            //A cell fully covered by one forest type gets a circle a little bigger than the cell.
            const DIAMETER_PER_SQRT_KM2 = 1100
            //the biggest circle diameter, as a factor of the cell size
            const MAX_DIAMETER_FACTOR = 1.2
            //the smallest circle diameter, in pixels
            const MIN_DIAMETER_PIX = 2
            //the diameter (in m) of the circle of a forest type area (in km2), in a cell of a resolution (in m)
            const circleDiameter = (areaKm2, resolution) =>
                Math.min(DIAMETER_PER_SQRT_KM2 * Math.sqrt(areaKm2), MAX_DIAMETER_FACTOR * resolution)

            //the forest types: column, label and primary colour. Broad-leaved and coniferous forests give green when they overlap.
            const TYPES = [
                { key: 'b', label: 'Broad-leaved forest', rgb: [245, 210, 0] },
                { key: 'c', label: 'Coniferous forest', rgb: [0, 200, 235] },
                { key: 'm', label: 'Mixed forest', rgb: [255, 20, 147] },
            ]

            //the map
            const map = new gridviz.Map(document.getElementById('map'), {
                x: 4500000,
                y: 3300000,
                z: 4000,
                //the legends of the styles are shown in the panel
                legendContainer: document.getElementById('legends'),
                //the tooltip is as wide as its lines (it is clipped at 20em by default)
                tooltip: { maxWidth: 'none' },
            }).addZoomButtons()

            //background: the land, from the Nuts2json countries (cntrg), without their outline. Kosovo is part of Serbia in them.
            //The countries of the NUTS regions (nutsrg_0) are kept, plus UK and Moldova.
            const COUNTRIES =
                'AL AT BA BE BG CH CY CZ DE DK EE EL ES FI FR HR HU IE IS IT LI LT LU LV ME MK MT NL NO PL PT RO RS SE SI SK TR UA UK MD'.split(
                    ' '
                )
            const LAND_COLOR = '#e6e6e6'
            const land = new gridviz.GeoJSONLayer({
                url: 'https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2024/3035/20M/cntrg.json',
                preprocess: (f) => COUNTRIES.includes(f.properties.id),
                fillStyle: () => LAND_COLOR,
                strokeStyle: () => null,
            })
            //the official boundaries of Eurostat (GISCO), as in the other examples: national and regional, with Kosovo. Above the circles.
            const boundaries = new gridviz.GeoJSONLayer(gridviz_eurostat.getEurostatBoundariesLayer())

            // The dataset: the area of each forest type (km2) in the cells, for each resolution
            const dataset = new gridviz.MultiResolutionDataset(
                RESOLUTIONS,
                (r) => new gridviz.CSVGrid(map, r + '.csv', r),
                {
                    //the CSV values are text
                    preprocess: (c) => {
                        for (const cr of TYPES) c[cr.key] = +c[cr.key]
                    },
                }
            )

            // The styles, one per forest type: a circle with an area proportional to the area of the forest type, in the colour of the forest type.
            // Multiplied together, the colours of the overlapping circles are those of a Venn diagram.
            const styles = TYPES.map(
                (type) =>
                    new gridviz.CircleColorSizeWebGLStyle({
                        color: () => 'rgb(' + type.rgb.join(',') + ')',
                        size: (c, r, z) =>
                            c[type.key] > 0 ? Math.max(circleDiameter(c[type.key], r), MIN_DIAMETER_PIX * z) : 0,
                        alpha: () => OPACITY,
                        blendOperation: () => 'multiply',
                    })
            )

            //a number with a space as the thousands separator (a no-break space), in the tooltip and in the legend
            const spaced = (v) => {
                const [integer, decimals] = String(v).split('.')
                return integer.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + (decimals ? '.' + decimals : '')
            }
            const fmt = (v) => spaced(v < 10 ? v.toFixed(1) : Math.round(v))
            const gridLayer = new gridviz.GridLayer(dataset, styles, {
                minPixelsPerCell: 6,
                //one line per forest type, with a badge of its colour. The forest types which are not in the cell are dimmed.
                cellInfoHTML: (c) =>
                    TYPES.map(
                        (cr) =>
                            `<div style="display:flex;align-items:center;gap:6px;white-space:nowrap;${
                                c[cr.key] > 0 ? '' : 'opacity:0.4'
                            }">` +
                            `<span style="width:12px;height:12px;border-radius:50%;flex:none;background:rgb(${cr.rgb});box-shadow:0 0 0 1px #0003 inset"></span>` +
                            `<span>${cr.label}: <b>${fmt(c[cr.key])}</b> km²</span></div>`
                    ).join(''),
            })
            map.layers = [land, gridLayer, boundaries]

            // Legend: the size legends of gridviz, for the circles of the map, and a Venn diagram for the colours.
            // Always three circles are shown, from the smallest to the biggest: the biggest is the one which fits (a round number), and the two others are smaller.
            // The legends are updated on each draw, with the resolution and the zoom: the circles have the size of the map ones.
            // The biggest is at most MAX_LEGEND_DIAMETER_PIX pixels wide and, so that the three circles can be told apart, at least
            // MIN_LEGEND_DIAMETER_PIX: it can then be bigger than the biggest circle of the map (MAX_DIAMETER_FACTOR times the cell size).
            const MAX_LEGEND_DIAMETER_PIX = 70
            const MIN_LEGEND_DIAMETER_PIX = 20
            //the biggest of 1, 2, 5 x 10^n which is not above a value
            const roundBelow = (x) => {
                const p = 10 ** Math.floor(Math.log10(x))
                return (x / p >= 5 ? 5 : x / p >= 2 ? 2 : 1) * p
            }
            //the values of the three legend circles, for a resolution and a zoom level
            const legendValues = (resolution, z) => {
                const maxDiameter = Math.min(
                    MAX_LEGEND_DIAMETER_PIX * z,
                    Math.max(MAX_DIAMETER_FACTOR * resolution, MIN_LEGEND_DIAMETER_PIX * z)
                )
                const biggest = roundBelow((maxDiameter / DIAMETER_PER_SQRT_KM2) ** 2)
                return [roundBelow(biggest / 25), roundBelow(biggest / 5), biggest]
            }
            //the size (in m) of a legend symbol, never smaller than the smallest circle of the map
            const legendSymbol = (diameter, z) => Math.max(diameter, MIN_DIAMETER_PIX * z)
            const formatValue = spaced
            const sizeLegendOptions = { fillColor: '#777', strokeColor: 'none', strokeWidth: 0.01, padding: '0px' }
            const sizeLegends = [0, 1, 2].map(
                (i) =>
                    new gridviz.SizeLegend({
                        ...sizeLegendOptions,
                        label: (viewScale, cells, resolution, z) => formatValue(legendValues(resolution, z)[i]),
                        size: (viewScale, resolution, z) =>
                            legendSymbol(DIAMETER_PER_SQRT_KM2 * Math.sqrt(legendValues(resolution, z)[i]), z),
                    })
            )

            //the colors of the variables: a Venn diagram, interactive: the cells of the colors of the hovered part are shown on the map
            const VENN_LABELS = ['Broad-leaved', 'Coniferous', 'Mixed']
            const vennLegend = new gridviz.VennLegend({
                title: 'Colour: forest type, overlaps are mixed',
                padding: '0px',
                titleFontSize: '12px',
                titleFontWeight: '600',
                items: TYPES.map((type, i) => ({ label: VENN_LABELS[i], color: 'rgb(' + type.rgb.join(',') + ')' })),
            })
            styles[0].legends = [...sizeLegends, vennLegend]
        </script>
    </body>
</html>
