<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>gridviz example</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/atom-one-dark.min.css"
        />
        <style>
            :root {
                --bar-height: 46px;
                --panel-width: 42vw;
                --text: #0f172a;
                --muted: #475569;
                --line: #dbe2ea;
                --accent: #0a66c2;
                --code-bg: #282c34;
                --code-text: #abb2bf;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                font-family: 'Segoe UI', Roboto, Arial, sans-serif;
                color: var(--text);
            }

            /* the bar on top: where we are, and the actions */
            .bar {
                height: var(--bar-height);
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 0 14px;
                background: #fff;
                border-bottom: 1px solid var(--line);
            }

            .bar a,
            .bar button {
                font: inherit;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                text-decoration: none;
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 5px 10px;
                cursor: pointer;
                white-space: nowrap;
            }

            .bar a:hover,
            .bar button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .bar .title {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 15px;
                font-weight: 700;
            }

            .bar .title small {
                margin-left: 8px;
                font-weight: 400;
                color: var(--muted);
            }

            /* the example on the left, the code on the right */
            .app {
                display: flex;
                height: calc(100% - var(--bar-height));
            }

            .stage {
                flex: 1;
                min-width: 0;
                position: relative;
            }

            .stage iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                background: #fff;
            }

            .splitter {
                flex: 0 0 8px;
                cursor: col-resize;
                background: #e8edf3;
                border-left: 1px solid var(--line);
                border-right: 1px solid var(--line);
                touch-action: none;
            }

            .splitter:hover,
            .splitter.dragging,
            .splitter:focus-visible {
                background: var(--accent);
                outline: none;
            }

            .code {
                flex: 0 0 var(--panel-width);
                min-width: 0;
                display: flex;
                flex-direction: column;
                padding: 18px;
                overflow: hidden;
                background: linear-gradient(135deg, #7a8fb5 0%, #5b6b8f 100%);
            }

            body.no-code .splitter,
            body.no-code .code {
                display: none;
            }

            /* the code, in a window, like carbon.now.sh */
            .window {
                /* as high as the code, like a carbon.now.sh card, and no higher than the panel */
                flex: 0 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--code-bg);
                border-radius: 10px;
                box-shadow: 0 20px 68px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
                overflow: hidden;
            }

            .window-bar {
                flex: none;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px 14px;
            }

            .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }

            .dot.red {
                background: #ff5f56;
            }
            .dot.yellow {
                background: #ffbd2e;
            }
            .dot.green {
                background: #27c93f;
            }

            .window-title {
                flex: 1;
                min-width: 0;
                margin: 0 6px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                text-align: center;
                font-size: 13px;
                color: #8b93a3;
                font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
            }

            .tabs {
                display: flex;
                gap: 2px;
                background: rgba(255, 255, 255, 0.07);
                border-radius: 7px;
                padding: 2px;
            }

            .tabs button,
            .copy {
                font: inherit;
                font-size: 12px;
                color: #8b93a3;
                background: none;
                border: 0;
                border-radius: 5px;
                padding: 3px 8px;
                cursor: pointer;
            }

            .tabs button[aria-pressed='true'] {
                background: rgba(255, 255, 255, 0.16);
                color: #fff;
            }

            .tabs button:hover,
            .copy:hover {
                color: #fff;
            }

            .copy {
                border: 1px solid rgba(255, 255, 255, 0.18);
            }

            pre {
                flex: 1 1 auto;
                min-height: 0;
                margin: 0;
                overflow: auto;
                padding: 4px 20px 22px;
                font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
                font-size: 13px;
                line-height: 1.6;
                tab-size: 4;
                color: var(--code-text);
            }

            pre code.hljs {
                padding: 0;
                background: none;
                overflow: visible;
            }

            .loading,
            .error {
                color: #8b93a3;
            }

            @media (max-width: 820px) {
                .app {
                    flex-direction: column;
                }
                .splitter {
                    display: none;
                }
                .stage {
                    flex: 0 0 56%;
                }
                .code {
                    flex: 1;
                    padding: 10px;
                }
                .bar .title small {
                    display: none;
                }
            }

            @media (max-width: 560px) {
                #open,
                #github {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <header class="bar">
            <a href="./" id="back" title="All the examples">&larr; Examples</a>
            <div class="title" id="title"></div>
            <a id="open" href="#" title="Open the example alone, without the code" target="_blank" rel="noopener"
                >Open alone &#8599;</a
            >
            <a id="github" href="#" title="The source of the example on GitHub" target="_blank" rel="noopener"
                >GitHub</a
            >
            <button id="toggle" type="button" aria-pressed="true" title="Show or hide the code">&lt;/&gt; Code</button>
        </header>

        <div class="app">
            <section class="stage"><iframe id="frame" title="The example"></iframe></section>
            <div
                class="splitter"
                id="splitter"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize the code panel"
                tabindex="0"
            ></div>
            <aside class="code" aria-label="Source code of the example">
                <div class="window">
                    <div class="window-bar">
                        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                        <span class="window-title" id="filename"></span>
                        <div class="tabs" id="tabs">
                            <button type="button" data-view="page" aria-pressed="true" title="The whole page">
                                Page
                            </button>
                            <button
                                type="button"
                                data-view="script"
                                aria-pressed="false"
                                title="Only the JavaScript of the page"
                            >
                                Script
                            </button>
                        </div>
                        <button class="copy" id="copy" type="button" title="Copy the code">Copy</button>
                    </div>
                    <pre><code id="source" class="loading">Loading...</code></pre>
                </div>
            </aside>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
        <script>
            // The viewer of an example: the example in a frame, and its source code beside it.
            // view.html?example=styles/lego.html  (a path relative to this folder)
            const $ = (id) => document.getElementById(id)
            const GITHUB = 'https://github.com/eurostat/gridviz/blob/master/examples/'

            // only a page of this folder is shown
            const example = new URLSearchParams(location.search).get('example') || ''
            const valid = /^[\w\-./]+\.html$/.test(example) && !example.includes('..') && !example.startsWith('/')

            if (!valid) {
                $('title').textContent = 'No example'
                $('source').className = 'error'
                $('source').textContent = 'Choose an example in the list of examples.'
                $('frame').remove()
            } else {
                document.title = example + ' - gridviz example'
                $('frame').src = example
                $('open').href = example
                $('github').href = GITHUB + example
                $('filename').textContent = example
                $('title').textContent = example
                load()
            }

            // the title and description of the example, from the list of the examples
            fetch('gallery.json')
                .then((r) => r.json())
                .then((list) => {
                    const e = list.find((x) => x.path === example)
                    if (!e) return
                    document.title = e.title + ' - gridviz example'
                    $('title').innerHTML = '<span></span><small></small>'
                    $('title').firstChild.textContent = e.title
                    $('title').lastChild.textContent = e.description
                })
                .catch(() => {})

            // The button to go back to the list of the examples: when the viewer was opened from the list, in this tab, it goes back
            // in the history, so that the list is as it was left (the same chapter, search and scroll).
            $('back').addEventListener('click', (e) => {
                let fromList = false
                try {
                    const ref = new URL(document.referrer)
                    const list = new URL('./', location.href)
                    fromList =
                        ref.origin === list.origin &&
                        (ref.pathname === list.pathname || ref.pathname === list.pathname + 'index.html')
                } catch (err) {
                    /* no referrer: the list is opened */
                }
                if (fromList && history.length > 1) {
                    e.preventDefault()
                    history.back()
                }
            })

            // the source code
            let page = ''
            let script = ''
            let view = 'page'

            async function load() {
                try {
                    const r = await fetch(example)
                    if (!r.ok) throw new Error('HTTP ' + r.status)
                    page = (await r.text()).replace(/\r\n/g, '\n').replace(/\s+$/, '') + '\n'
                    // the JavaScript written in the page: its scripts without src
                    const doc = new DOMParser().parseFromString(page, 'text/html')
                    script = [...doc.querySelectorAll('script:not([src])')]
                        .map((s) => dedent(s.textContent.replace(/^\n+|\s+$/g, '')))
                        .join('\n\n')
                    if (!script) $('tabs').style.display = 'none'
                    show()
                } catch (e) {
                    $('source').className = 'error'
                    $('source').textContent = 'The source could not be loaded: ' + e.message
                }
            }

            // removes the indentation common to all the lines
            function dedent(text) {
                const lines = text.split('\n')
                const indents = lines.filter((l) => l.trim()).map((l) => l.match(/^\s*/)[0].length)
                const n = indents.length ? Math.min(...indents) : 0
                return lines.map((l) => l.slice(n)).join('\n')
            }

            function show() {
                const code = $('source')
                const text = view === 'script' ? script : page
                code.className = ''
                code.textContent = text
                code.removeAttribute('data-highlighted')
                if (window.hljs) hljs.highlightElement(code)
                code.parentElement.scrollTop = 0
                $('filename').textContent = view === 'script' ? example.replace(/\.html$/, '.js') : example
                for (const b of $('tabs').children) b.setAttribute('aria-pressed', b.dataset.view === view)
            }

            $('tabs').addEventListener('click', (e) => {
                const b = e.target.closest('button')
                if (!b) return
                view = b.dataset.view
                show()
            })

            $('copy').addEventListener('click', async () => {
                const b = $('copy')
                try {
                    await navigator.clipboard.writeText(view === 'script' ? script : page)
                    b.textContent = 'Copied'
                } catch (e) {
                    b.textContent = 'Not copied'
                }
                setTimeout(() => (b.textContent = 'Copy'), 1500)
            })

            // show or hide the code
            const setCode = (on) => {
                document.body.classList.toggle('no-code', !on)
                $('toggle').setAttribute('aria-pressed', on)
                localStorage.setItem('gridviz-code-panel', on ? 'on' : 'off')
            }
            $('toggle').addEventListener('click', () => setCode(document.body.classList.contains('no-code')))
            if (localStorage.getItem('gridviz-code-panel') === 'off') setCode(false)

            // the width of the code, which can be changed by dragging the splitter (or with the arrow keys)
            const root = document.documentElement
            const setWidth = (px) => {
                const w = Math.max(280, Math.min(px, window.innerWidth - 280))
                root.style.setProperty('--panel-width', w + 'px')
                localStorage.setItem('gridviz-code-width', Math.round(w))
            }
            const saved = +localStorage.getItem('gridviz-code-width')
            if (saved) setWidth(saved)

            const splitter = $('splitter')
            splitter.addEventListener('pointerdown', (e) => {
                splitter.setPointerCapture(e.pointerId)
                splitter.classList.add('dragging')
                // the frame would take the mouse events away from the splitter
                $('frame').style.pointerEvents = 'none'
            })
            splitter.addEventListener('pointermove', (e) => {
                if (splitter.hasPointerCapture(e.pointerId)) setWidth(window.innerWidth - e.clientX - 4)
            })
            const endDrag = (e) => {
                splitter.classList.remove('dragging')
                $('frame').style.pointerEvents = ''
                if (splitter.hasPointerCapture(e.pointerId)) splitter.releasePointerCapture(e.pointerId)
            }
            splitter.addEventListener('pointerup', endDrag)
            splitter.addEventListener('pointercancel', endDrag)
            splitter.addEventListener('keydown', (e) => {
                const w = document.querySelector('.code').getBoundingClientRect().width
                if (e.key === 'ArrowLeft') setWidth(w + 40)
                else if (e.key === 'ArrowRight') setWidth(w - 40)
                else return
                e.preventDefault()
            })
        </script>
    </body>
</html>
