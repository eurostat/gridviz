<div id="map" style="height: 100%; width: 100%"></div>

<script src="../../dist/gridviz.min.js"></script>
<script>
    //define map
    const map = new gridviz.Map(document.getElementById('map'), { x: 4500000, y: 2900000, z: 1000 })

    //limit what can be seen: xmin, ymin, xmax, ymax. The borders of the view stay inside.
    map.setViewExtent([2500000, 1300000, 6500000, 5300000])

    //define zoom extent
    map.setZoomExtent([200, 3000])

    //add layer to map
    const dataset = new gridviz.CSVGrid(
        map,
        'https://raw.githubusercontent.com/eurostat/gridviz/master/assets/csv/Europe/pop_2018_10km.csv',
        10000
    )
    const colorFunction = (cell) => {
        if (cell.population > 60000) return '#d95f0e'
        else if (cell.population > 6000) return '#fec44f'
        else return '#ffffd4'
    }
    map.layers = [
        new gridviz.GridLayer(dataset, [new gridviz.ShapeColorSizeStyle({ color: colorFunction })], {
            cellInfoHTML: (c) => '<b>' + (+c.population).toLocaleString() + '</b> inhabitants (2018)',
        }),
    ]
</script>
