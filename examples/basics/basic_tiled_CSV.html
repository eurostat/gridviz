<body style="margin: 0">
<div id="map" style="height: 100%; width: 100%"></div>

<script src="../../dist/gridviz.js"></script>
<script>
    //define map with initial view
    const map = new gridviz.Map(document.getElementById('map'), {
        x: 4500000,
        y: 2900000,
        z: 3000,
    }).addZoomButtons()

    //define dataset
    const dataset = new gridviz.TiledGrid(
        map,
        'https://raw.githubusercontent.com/jgaffuri/tiledgrids/main/data/europe/population2/10000m/'
    )

    //define color for each cell c
    const colorFunction = (cell) => {
        if (cell.TOT_P_2021 > 150000) return '#993404'
        else if (cell.TOT_P_2021 > 60000) return '#d95f0e'
        else if (cell.TOT_P_2021 > 20000) return '#fe9929'
        else if (cell.TOT_P_2021 > 6000) return '#fec44f'
        else if (cell.TOT_P_2021 > 1500) return '#fee391'
        else return '#ffffd4'
    }

    //define style
    const style = new gridviz.ShapeColorSizeStyle({ color: colorFunction })

    //country names
    // prettier-ignore
    const countries = {
        AL: 'Albania', AT: 'Austria', BA: 'Bosnia and Herzegovina', BE: 'Belgium', BG: 'Bulgaria',
        CH: 'Switzerland', CY: 'Cyprus', CZ: 'Czechia', DE: 'Germany', DK: 'Denmark', EE: 'Estonia',
        EL: 'Greece', ES: 'Spain', FI: 'Finland', FR: 'France', HR: 'Croatia', HU: 'Hungary',
        IE: 'Ireland', IS: 'Iceland', IT: 'Italy', LI: 'Liechtenstein', LT: 'Lithuania',
        LU: 'Luxembourg', LV: 'Latvia', ME: 'Montenegro', MK: 'North Macedonia', MT: 'Malta',
        NL: 'Netherlands', NO: 'Norway', PL: 'Poland', PT: 'Portugal', RO: 'Romania', RS: 'Serbia',
        SE: 'Sweden', SI: 'Slovenia', SK: 'Slovakia', UK: 'United Kingdom', XK: 'Kosovo',
    }

    //add layer to map
    map.layers = [
        new gridviz.GridLayer(dataset, [style], {
            cellInfoHTML: (c) =>
                '<b>' +
                (countries[c.CNTR_ID] || c.CNTR_ID) +
                '</b><br>2021 population: ' +
                (+c.TOT_P_2021).toLocaleString(),
        }),
    ]
</script>
