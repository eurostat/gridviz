<div id="map" style="height: 100%; width: 100%"></div>
<div id="settings" style="position: absolute; left: 20px; top: 20px; padding: 10px; border-radius: 5px; background: #ffffffcc; line-height: 1.6; box-shadow: 5px 5px 5px grey; font-family: Arial, Helvetica, sans-serif">
    Opacity: <b id="alphaValue">0.75</b><br />
    <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.75" style="width: 250px" />
</div>

<script src="../../dist/gridviz.js"></script>
<script>
    //the settings of the sliders. The style reads them when it draws.
    const settings = {}
    let onSettingsChange = () => map.redraw()
    for (const input of document.querySelectorAll('#settings input')) {
        settings[input.id] = +input.value
        input.addEventListener('input', () => {
            settings[input.id] = +input.value
            document.getElementById(input.id + 'Value').textContent = input.value
            onSettingsChange()
        })
    }

    //define map with initial view
    const map = new gridviz.Map(document.getElementById('map'), {
        x: 4300000,
        y: 2900000,
        z: 300,
    }).addZoomButtons()

    //define dataset
    const dataset = new gridviz.CSVGrid(
        map,
        'https://raw.githubusercontent.com/eurostat/gridviz/master/assets/csv/Europe/pop_2018_10km.csv',
        10000
    )

    //define color for each cell c
    const colorFunction = (cell) => {
        if (cell.population > 150000) return '#993404'
        else if (cell.population > 60000) return '#d95f0e'
        else if (cell.population > 20000) return '#fe9929'
        else if (cell.population > 6000) return '#fec44f'
        else if (cell.population > 1500) return '#fee391'
        else return '#ffffd4'
    }

    //define style
    const style = new gridviz.ShapeColorSizeStyle({
        color: colorFunction,
        alpha: (z) => (z < 70 ? settings.alpha : 1.0),
        blendOperation: (z) => 'multiply',
    })

    //define WMS background layer
    const backgroundLayer = new gridviz.BackgroundLayerWMS({
        url: 'https://sgx.geodatenzentrum.de/wms_basemapde?&service=WMS&request=GetMap&layers=de_basemapde_web_raster_grau&styles=&format=image%2Fjpeg&transparent=false&version=1.1.1&srs=EPSG%3A3035',
    })

    //add layer to map
    map.layers = [
        backgroundLayer,
        new gridviz.GridLayer(dataset, [style], {
            cellInfoHTML: (c) => '<b>' + (+c.population).toLocaleString() + '</b> inhabitants (2018)',
        }),
    ]
</script>
