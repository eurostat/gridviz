<div id="map" style="height: 100%; width: 100%"></div>

<script src="../../dist/gridviz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gridviz-eurostat@2.0.2"></script>
<script>
    //define map with initial view
    const map = new gridviz.Map(document.getElementById('map'), {
        x: 4046000,
        y: 2654000,
        z: 4,
    }).addZoomButtons()

    //define background layer
    const backgroundLayer = new gridviz.BackgroundLayer(
        gridviz_eurostat.giscoBackgroundLayer('OSMPositronBackground', 18, 'EPSG3035')
    )

    //make geojson layer
    const geojsonLayer = new gridviz.GeoJSONLayer({
        url: 'https://raw.githubusercontent.com/eurostat/gridviz/master/examples/basics/geojson_test.json',
        shape: (f, z) => (f.properties.name == 'Fox' ? 'circle' : 'square'),
        //size: (f, z) => Math.max(2, 10000 / z),
        //strokeStyle: (f, z) => 'black',
        //fillStyle: (f, z) => 'red',
        //lineWidth: (f, z) => (z < 2000 ? 2 : 0),
    })


    //add layer to map
    map.layers = [backgroundLayer, geojsonLayer]
    map.redraw()
</script>
