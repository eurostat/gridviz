<div id="map" style="height: 100%; width: 100%"></div>
<div
    id="settings"
    style="
        position: absolute;
        left: 20px;
        top: 20px;
        padding: 10px;
        border-radius: 5px;
        background: #ffffffcc;
        line-height: 1.6;
        box-shadow: 5px 5px 5px grey;
        font-family: Arial, Helvetica, sans-serif;
    "
>
    Stretching: logarithmic base (0: none): <b id="baseValue">-7</b><br />
    <input type="range" id="base" min="-30" max="0" step="1" value="-7" style="width: 250px" />
</div>

<script src="../../dist/gridviz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
<script>
    //the settings of the sliders. The style reads them when it draws.
    const settings = {}
    let onSettingsChange = () => map.redraw()
    for (const input of document.querySelectorAll('#settings input')) {
        settings[input.id] = +input.value
        input.addEventListener('input', () => {
            settings[input.id] = +input.value
            document.getElementById(input.id + 'Value').textContent = input.value
            onSettingsChange()
        })
    }

    //define map with initial view
    const map = new gridviz.Map(document.getElementById('map'), {
        x: 4500000,
        y: 2900000,
        z: 1000,
    }).addZoomButtons()

    //define dataset
    const dataset = new gridviz.CSVGrid(
        map,
        'https://raw.githubusercontent.com/eurostat/gridviz/master/assets/csv/Europe/pop_2018_10km.csv',
        10000
    )

    //define color style

    //define stretching function: to stetch the color scale so that higher population cells are better differenciated
    const scale = (t) => gridviz.logarithmicScale(settings.base)(t)

    const style = new gridviz.ShapeColorSizeStyle({
        //compute [min,max] population within the map view
        viewScale: (cells) => {
            let max, min
            for (let cell of cells) {
                const v = +cell.population
                if (max == undefined || max < v) max = v
                if (min == undefined || min > v) min = v
            }
            return [min, max]
        },
        //map population figure from [min,max] interval to [0,1], apply the stretching function and return the corresponding color
        color: (cell, resolution, z, [min, max]) => d3.interpolateYlOrRd(scale((+cell.population - min) / (max - min))),
    })

    //add layer to map
    map.layers = [
        new gridviz.GridLayer(dataset, [style], {
            cellInfoHTML: (c) => '<b>' + (+c.population).toLocaleString() + '</b> inhabitants (2018)',
        }),
    ]
</script>
