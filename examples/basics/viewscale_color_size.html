<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gridviz view scale for the color and the size example</title>
        <style>
            html,
            body {
                height: 100%; /* Ensure the parent elements have a height so that the map can take up 100% correctly */
                margin: 0; /* Remove default margins to prevent scrolling */
                overflow: hidden; /* Prevent potential scrollbars */
            }
        </style>
    </head>
    <body>
        <div id="map" style="height: 100%; width: 100%"></div>

        <script src="../../dist/gridviz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-format@3"></script>
        <script>
            //define map with initial view
            const map = new gridviz.Map(document.getElementById('map'), {
                x: 4000000,
                y: 2900000,
                z: 1000,
            }).addZoomButtons()

            //define dataset: the population in 2011 and 2021
            const dataset = new gridviz.MultiResolutionDataset(
                [1000, 2000, 5000, 10000, 20000, 50000, 100000],
                (resolution) =>
                    new gridviz.TiledGrid(
                        map,
                        'https://raw.githubusercontent.com/jgaffuri/tiledgrids/main/data/europe/population2/' +
                            resolution +
                            'm/',
                        {
                            preprocess: (c) => {
                                if (!+c.TOT_P_2011 || !+c.TOT_P_2021) return false
                                // change of the population between 2011 and 2021, in %, between -30 and +30
                                const change = (100 * (c.TOT_P_2021 - c.TOT_P_2011)) / c.TOT_P_2011
                                c.change = Math.max(-30, Math.min(30, change))
                            },
                        }
                    )
            )

            // A style has a single viewScale, but it can be an object with one scale for each visual variable: the size and the color.
            // viewScaleCombination makes it from a view scale for each. The functions of the style and of the legends
            // then take the one they need: viewScale.size or viewScale.color.
            const style = new gridviz.ShapeColorSizeStyle({
                shape: () => 'circle',
                size: (c, r, z, viewScale) => viewScale.size(+c.TOT_P_2021),
                color: (c, r, z, viewScale) => viewScale.color(c.change),
                viewScale: gridviz.viewScaleCombination({
                    size: gridviz.viewScale({
                        valueFunction: (c) => +c.TOT_P_2021,
                        maxSizeFactor: 1.3,
                        stretching: gridviz.logarithmicScale(-8),
                    }),
                    color: gridviz.viewScaleColor({
                        valueFunction: (c) => c.change,
                        colorScale: d3.interpolateRdBu,
                    }),
                }),
            })

            // The legend of the color uses the color view scale to write its labels...
            const colorLegend = new gridviz.ColorLegend({
                title: 'Population change 2011-2021 (%)',
                colorScale: d3.interpolateRdBu,
                ticks: 5,
                textScale: (t, viewScale) => viewScale?.color?.invert(t),
                tickFormat: d3.format('+d'),
            })

            // ... and the legend of the size uses the size view scale to draw its circles
            const sizeLegends = gridviz.sizeLegendViewScale((cell) => +cell.TOT_P_2021, {
                k: [0.8, 0.2, 0.01, 0.002],
                title: 'Population in 2021',
                fillColor: '#888',
                labelFormat: d3.format(',.2r'),
                viewScaleFun: (viewScale) => viewScale.size,
            })

            style.legends = [colorLegend, sizeLegends]

            map.layers = [
                new gridviz.GridLayer(dataset, [style], {
                    minPixelsPerCell: 5,
                    cellInfoHTML: (c) =>
                        '<b>' +
                        c.TOT_P_2021 +
                        '</b> inhabitants in 2021, ' +
                        d3.format('+.0f')(c.change) +
                        '% since 2011',
                }),
            ]
        </script>
    </body>
</html>
